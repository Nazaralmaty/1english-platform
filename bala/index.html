<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1English · Бүгін</title>
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <img src="../assets/logo.png" alt="1English" style="height:26px;width:auto">
    <a class="pill" id="lvpill" href="dengey.html">—</a>
    <div class="grow"></div>
    <div class="pill gold" id="streak">🔥 <span class="num">0</span></div>
  </header>

  <div class="scroll">
    <p class="tag" id="hello">Сәлем!</p>
    <h2 class="big" style="margin:2px 0 16px" id="dayline">Бүгін не істейміз?</h2>

    <a class="card navy" id="main" href="#" style="display:block">
      <div class="row between">
        <div class="grow">
          <div class="tag" style="color:#9CC4F5" id="mainTag">КЕЛЕСІ ҚАДАМ</div>
          <div class="card-t" id="mainT" style="margin-top:6px">…</div>
          <div class="card-s" id="mainS">…</div>
        </div>
        <div style="font-size:30px" id="mainIc">▶</div>
      </div>
      <div class="bar" style="margin-top:14px"><i id="mainBar" style="width:0%"></i></div>
    </a>

    <div class="card">
      <div class="row">
        <div class="ava" style="background:#EAF1FB">🎥</div>
        <div class="grow">
          <div class="card-t">Zoom сабағы</div>
          <div class="card-s" id="zoomS">—</div>
        </div>
        <a class="btn sm ghost" id="zoomBtn" href="#" target="_blank" rel="noopener">Кіру</a>
      </div>
    </div>

    <div class="h2" id="modName">МОДУЛЬ</div>
    <div id="week" class="stack"></div>

    <div class="h2">Тез жаттығу</div>
    <div class="row" style="gap:10px;align-items:stretch">
      <a class="card flat grow center" href="sozdik.html" style="margin:0;padding:18px 10px">
        <div style="font-size:26px">📇</div>
        <div class="card-t" style="font-size:15px;margin-top:6px">Қайталау</div>
        <div class="card-s" id="dueN">0 сөз</div>
      </a>
      <a class="card flat grow center" href="oiyn.html" style="margin:0;padding:18px 10px">
        <div style="font-size:26px">🎮</div>
        <div class="card-t" style="font-size:15px;margin-top:6px">Ойын</div>
        <div class="card-s">3 арена</div>
      </a>
    </div>

    <a class="card" id="ai" href="ai_test.html" style="display:block;background:linear-gradient(135deg,#0A3161,#B31942);color:#fff">
      <div class="row between">
        <div class="grow">
          <div class="tag" style="color:#FFC9D6">АЙ САЙЫНҒЫ ТЕСТ</div>
          <div class="card-t" style="margin-top:6px">Деңгейіңді тексер</div>
          <div class="card-s" style="color:#F2D9E0" id="aiS">Сұрақтар дұрыс жауап сайын қиындай береді</div>
        </div>
        <div style="font-size:28px">🎯</div>
      </div>
    </a>
  </div>
</div>

<script src="../assets/app.js"></script>
<script src="../data/course.js"></script>
<script src="../data/words.js"></script>
<script src="../data/lessons_b.js"></script>
<script src="../data/lessons_e.js"></script>
<script>
(function(){
  var S = App.load(), $ = App.$;
  /* уровень не выбран — сначала выбор, иначе показывать нечего.
     В прогоне ?test=1 редирект убил бы проверку, поэтому там берём Beginner. */
  if (!S.level) {
    if (App.qs('test') === '1') { S.level = 'beginner'; App.save(); }
    else { location.replace('dengey.html'); return; }
  }

  var lv = COURSE.level(S.level);
  $('#lvpill').textContent = lv.name;

  var h = new Date().getHours();
  $('#hello').textContent = (h < 12 ? 'Қайырлы таң' : h < 18 ? 'Қайырлы күн' : 'Кеш жарық') +
                            (S.user.name ? ', ' + S.user.name : '') + '!';
  $('#streak').innerHTML = '🔥 <span class="num">' + S.streak.days + '</span>';
  $('#zoomS').textContent = COURSE.zoom.day + ' · ' + COURSE.zoom.time;
  $('#zoomBtn').href = COURSE.zoom.link;

  var cur = App.curUnit(COURSE, S.level);
  var due = App.dueWords(WORDS.upTo(cur.id));
  $('#dueN').textContent = due.length + ' сөз';

  var last = (S.monthly || [])[S.monthly.length - 1];
  if (last) $('#aiS').textContent = 'Соңғы нәтиже: ' + last.band + ' · ' + last.xp + ' XP';

  var m = {};
  if (due.length >= 5) {
    m = { tag:'БҮГІНГІ ҚАЙТАЛАУ', t:due.length + ' сөзді қайталау',
          s:'3 минут. Ұмытпау үшін — күнде.', href:'sozdik.html', ic:'📇',
          bar: Math.round(100 * (1 - due.length / Math.max(WORDS.upTo(cur.id).length, 1))) };
  } else {
    var u = App.unit(cur.id), L = LESSONS[cur.id] || {};
    var step = (L.video && u.video < 1) ? 'Бейнесабақ'
             : (!u.wordsDone) ? 'Жаңа 8 сөз'
             : (Object.keys(u.ex).length < 4) ? 'Жаттығулар'
             : (!u.game) ? 'Ойын аренасы'
             : 'Сабақ тесті';
    m = { tag:cur.num + '-САБАҚ · ' + lv.name.toUpperCase(), t:cur.kk,
          s:step + ' · ' + cur.cando, href:'sabaq.html?u=' + cur.id, ic:'▶',
          bar: Math.round(App.unitProgress(cur.id) * 100) };
  }
  $('#mainTag').textContent = m.tag; $('#mainT').textContent = m.t;
  $('#mainS').textContent = m.s;     $('#mainIc').textContent = m.ic;
  $('#main').href = m.href;          $('#mainBar').style.width = m.bar + '%';

  /* текущий модуль целиком: три урока с общей целью */
  var mod = COURSE.modules.filter(function(x){ return x.id === cur.mod; })[0];
  $('#modName').textContent = mod.num + '-МОДУЛЬ · ' + mod.kk.toUpperCase();
  var wrap = $('#week');
  COURSE.inMod(mod.id).forEach(function(u){
    var p = Math.round(App.unitProgress(u.id) * 100), open = u.ready;
    var a = App.el('a', 'card' + (open ? '' : ' flat'));
    a.href = open ? 'sabaq.html?u=' + u.id : '#';
    a.style.opacity = open ? 1 : .55;
    a.innerHTML =
      '<div class="row">' +
        '<div class="ava">' + (App.unitDone(u.id) ? '✓' : u.num) + '</div>' +
        '<div class="grow"><div class="card-t">' + u.kk + '</div>' +
        '<div class="card-s">' + (open ? u.cando : 'Дайындалуда') + '</div></div>' +
        (open ? '' : '<div style="font-size:18px">🔒</div>') +
      '</div>' +
      (open ? '<div class="bar thin" style="margin-top:12px"><i style="width:' + p + '%"></i></div>' : '');
    wrap.appendChild(a);
  });

  App.tabs('index.html');
  if (App.qs('test') === '1') {
    console.assert(!!$('#main').getAttribute('href'), 'главная карточка без ссылки');
    console.assert(wrap.children.length === 3, 'в модуле должно быть 3 урока');
    console.assert(document.body.scrollWidth <= window.innerWidth + 1, 'экран едет вбок');
    console.log('OK bala/index');
  }
})();
</script>
</body>
</html>
