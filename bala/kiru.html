<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1English · Кіру</title>
<link rel="stylesheet" href="../assets/app.css">
<style>
  .wrap{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:24px var(--pad) 40px;max-width:480px;margin:0 auto}
  .inp{width:100%;background:var(--white);border:2px solid var(--line);border-radius:16px;padding:16px;
       font-size:19px;font-weight:800;letter-spacing:.5px;text-align:center}
  .inp:focus{outline:none;border-color:var(--navy)}
  .note{font-size:13px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <img src="../assets/logo.png" alt="1English" style="height:34px;width:auto;margin:0 auto 26px">
  <div id="step"></div>
</div>
<script src="../assets/app.js"></script>
<script>
(function(){
  var $ = App.$, step = $('#step'), phone = '';

  function askPhone(){
    step.innerHTML =
      '<h1 class="big center" style="font-size:27px;margin-bottom:8px">Нөміріңізді енгізіңіз</h1>' +
      '<p class="note" style="margin:0 0 20px">Курсқа тіркелген нөмір. Email қажет емес.</p>' +
      '<input class="inp" id="p" type="tel" inputmode="numeric" placeholder="+7 (___) ___ __ __" value="+7">' +
      '<button class="btn" id="go" style="margin-top:14px">Кодты жіберу</button>' +
      '<p class="note">Прототипте кез келген 4 сан жарайды.<br>Нағыз SMS Ф3-те Supabase арқылы қосылады.</p>';
    var p = $('#p');
    p.oninput = function(){
      var d = p.value.replace(/\D/g,'').replace(/^8/,'7').slice(0,11);
      if (!d) d = '7';
      var out = '+' + d[0];
      if (d.length > 1) out += ' (' + d.slice(1,4);
      if (d.length >= 4) out += ') ' + d.slice(4,7);
      if (d.length >= 7) out += ' ' + d.slice(7,9);
      if (d.length >= 9) out += ' ' + d.slice(9,11);
      p.value = out;
      $('#go').disabled = d.length < 11;
    };
    p.oninput();
    $('#go').onclick = function(){ phone = p.value; askCode(); };
    setTimeout(function(){ p.focus(); }, 200);
  }

  function askCode(){
    step.innerHTML =
      '<h1 class="big center" style="font-size:27px;margin-bottom:8px">Код</h1>' +
      '<p class="note" style="margin:0 0 20px">' + phone + ' нөміріне жіберілді</p>' +
      '<input class="inp" id="c" type="tel" inputmode="numeric" maxlength="4" placeholder="••••">' +
      '<button class="btn" id="go" style="margin-top:14px" disabled>Растау</button>' +
      '<button class="btn ghost" id="bk" style="margin-top:10px">Нөмірді өзгерту</button>';
    var c = $('#c');
    c.oninput = function(){ c.value = c.value.replace(/\D/g,''); $('#go').disabled = c.value.length < 4; };
    $('#go').onclick = askName;
    $('#bk').onclick = askPhone;
    setTimeout(function(){ c.focus(); }, 200);
  }

  function askName(){
    step.innerHTML =
      '<h1 class="big center" style="font-size:27px;margin-bottom:8px">Атың кім?</h1>' +
      '<p class="note" style="margin:0 0 20px">Осылай ұстаз бен ата-ана көреді</p>' +
      '<input class="inp" id="n" placeholder="Айша" autocomplete="given-name">' +
      '<button class="btn" id="go" style="margin-top:14px">Бастау</button>';
    var n = $('#n');
    $('#go').onclick = function(){
      var S = App.load();
      S.user.name = (n.value || 'Оқушы').trim();
      S.user.phone = phone;
      S.user.group = 'Балалар тобы · Дс/Ср/Жм';
      App.save(); App.touchStreak();
      location.href = 'index.html';
    };
    setTimeout(function(){ n.focus(); }, 200);
  }

  askPhone();

  if (App.qs('test') === '1') {
    var p = $('#p'); p.value = '+7 777 123 45 67'; p.oninput();
    console.assert(!$('#go').disabled, 'кнопка не разблокировалась на полном номере');
    $('#go').click();
    var c = $('#c'); c.value = '1234'; c.oninput(); $('#go').click();
    $('#n').value = 'Айша'; 
    console.assert(!!$('#n'), 'шаг с именем не открылся');
    console.assert(document.body.scrollWidth <= window.innerWidth + 1, 'экран едет вбок');
    console.log('OK bala/kiru');
  }
})();
</script>
</body>
</html>
