<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F4F0">
<title>1English · контроль уроков</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="app/style.css">
<style>
  /* Контроль уроков: как компания видит индивидуальные занятия из одной
     системы. Три взгляда на одни и те же данные:
       Учитель      — журнал уроков, готовый план из курса, отметка «провёл»;
       Клиент       — что приходит каждые две недели: подтвердить уроки;
       Администратор— единый дашборд и очередь расхождений.
   Демо живёт в памяти вкладки: обновил страницу — всё вернулось как было.

     ВАЖНО про имена классов: app/style.css уже занят .bar, .panel, .row,
     .card, .kpi. Всё своё — с приставкой v-. */
  body{background:var(--bg)}
  .v-wrap{max-width:1180px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px 80px}

  .v-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .v-top h1{font-size:24px;letter-spacing:-.03em;flex:1;min-width:180px}
  .v-tabs{display:flex;gap:6px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--sh-1)}
  .v-tabs button{border:0;background:transparent;border-radius:999px;padding:9px 16px;font:inherit;
                 font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
  .v-tabs button.on{background:var(--navy);color:var(--on-navy)}

  .v-note{background:var(--card);border-radius:14px;box-shadow:var(--sh-1);padding:12px 16px;
          font-size:13.5px;color:var(--muted);line-height:1.5;margin-bottom:16px}
  .v-note b{color:var(--ink)}

  /* ── карточки и таблицы ───────────────────────────────────────────── */
  .v-card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--sh-1);padding:20px;margin-bottom:16px}
  .v-card h3{font-size:17px;letter-spacing:-.02em;margin-bottom:4px}
  .v-card .hint{font-size:13.5px;color:var(--muted);line-height:1.5;margin-bottom:14px}
  .v-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
  .v-kpi{background:var(--card);border-radius:var(--r-card);box-shadow:var(--sh-1);padding:18px 20px}
  .v-kpi b{display:block;font-size:28px;font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
  .v-kpi span{display:block;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.35}
  .v-kpi.hot{background:var(--accent-soft);color:var(--accent)} .v-kpi.hot span{color:var(--accent)}

  .scrollx{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:640px}
  th,td{text-align:left;padding:12px 14px;font-size:14px;white-space:nowrap}
  th{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;
     border-bottom:1px solid var(--line)}
  tr + tr td{border-top:1px solid var(--line)}
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}

  /* ── ученик целиком ──────────────────────────────────────────────── */
  .v-who{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .v-who .ava{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;
              background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:16px;
              margin:0;box-shadow:none}
  .v-who b{font-size:16.5px;letter-spacing:-.01em;display:block}
  .v-who .ph{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .v-tags{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
  .v-tag{background:var(--bg);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--navy)}
  .v-tag.g{background:var(--ok-soft);color:var(--ok)}
  .v-tag.a{background:var(--accent-soft);color:var(--accent)}
  .v-meta{font-size:13px;line-height:1.55;color:var(--muted);margin-bottom:12px}
  .v-meta i{font-style:normal;color:var(--ink);font-weight:600}

  .v-les{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;flex-wrap:wrap}
  .v-les + .v-les{margin-top:2px}
  .v-les:hover{background:var(--bg)}
  .v-les .d{font-size:12.5px;color:var(--faint);width:64px;flex:none;font-variant-numeric:tabular-nums}
  .v-les .tp{flex:1;min-width:140px;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .v-les .tp.empty{color:var(--faint)}
  .v-les input[type=checkbox]{width:17px;height:17px;flex:none;accent-color:var(--ok);cursor:pointer;margin:0}
  .v-les.off .tp{color:var(--muted)}

  .v-pill{flex:none;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .v-pill.ok{background:var(--ok-soft);color:var(--ok)}
  .v-pill.bad{background:var(--accent-soft);color:var(--accent)}
  .v-pill.wait{background:var(--bg);color:var(--muted)}
  .v-pill.hold{background:#F5E8C8;color:#8A6A12}

  .v-btn{background:var(--navy);color:var(--on-navy);border:0;border-radius:999px;padding:10px 18px;
         font:inherit;font-size:14px;font-weight:700;cursor:pointer}
  .v-btn:disabled{opacity:.5;cursor:default}
  .v-btn.quiet{background:var(--bg);color:var(--ink)}
  .v-mini{background:var(--bg);border:0;border-radius:999px;padding:7px 12px;font:inherit;
          font-size:12.5px;font-weight:700;color:var(--navy);cursor:pointer}
  .v-mini:hover{background:var(--track)}
  .v-mini.bad{color:var(--accent)}
  .v-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

  /* ── клиент: письмо и форма ответа ───────────────────────────────── */
  .v-letter{background:var(--bg);border-radius:14px;padding:16px;font-size:14px;line-height:1.55;
            margin-bottom:16px;border-left:4px solid var(--navy)}
  .v-letter .from{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;
                  text-transform:uppercase;letter-spacing:.05em}
  .v-ans{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--bg);flex-wrap:wrap}
  .v-ans + .v-ans{margin-top:6px}
  .v-ans .tp{flex:1;min-width:150px;font-size:14px}
  .v-ans .d{font-size:12.5px;color:var(--muted);width:64px;flex:none;font-variant-numeric:tabular-nums}
  .seg{display:flex;gap:4px;background:var(--card);border-radius:999px;padding:3px}
  .seg button{border:0;background:transparent;border-radius:999px;padding:7px 12px;font:inherit;
              font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--ok);color:#fff}
  .seg button.on.no{background:var(--accent)}
  .q{display:flex;gap:3px}
  .q button{width:30px;height:30px;border:0;border-radius:50%;background:var(--card);font:inherit;
            font-size:12.5px;font-weight:800;color:var(--muted);cursor:pointer}
  .q button.on{background:var(--navy);color:var(--on-navy)}
  .q button.on.low{background:var(--accent)}
  .v-note-f{width:100%;background:var(--card);border:0;border-radius:12px;padding:11px 13px;font:inherit;
            font-size:14px;color:var(--ink);min-height:64px;resize:vertical;margin-top:12px;outline:none}

  /* ── очередь проверок ─────────────────────────────────────────────── */
  .v-tick{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .v-tick .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .v-tick .hd b{font-size:14.5px}
  .v-tick p{font-size:13.5px;color:var(--muted);line-height:1.5;margin-bottom:10px}
  .v-tick .sum{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
  .v-tick.done{opacity:.6}
  .v-log{font-size:13.5px;line-height:1.6;color:var(--muted)}
  .v-log div{padding:6px 0;border-top:1px solid var(--line)}
  .v-log b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}

  .v-empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.55}

  dialog{border:0;border-radius:var(--r-card);padding:0;max-width:620px;width:calc(100% - 28px);
         margin:auto;max-height:88vh;overflow:auto;
         background:var(--card);color:var(--ink);box-shadow:var(--sh-2)}
  dialog::backdrop{background:rgba(10,27,46,.45)}
  .dlg{padding:22px}
  .dlg h3{font-size:19px;letter-spacing:-.02em;margin-bottom:4px}
  .dlg .sub{font-size:13.5px;color:var(--muted);margin-bottom:16px;line-height:1.5}
  .dlg-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .dlg-foot button{border:0;border-radius:12px;padding:11px 18px;font:inherit;font-size:14.5px;
                   font-weight:700;cursor:pointer;background:var(--bg);color:var(--ink)}
  .dlg-foot button.go{background:var(--navy);color:var(--on-navy)}
  .v-words{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .v-words span{background:var(--bg);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600}
  .v-rule{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.55;
          color:var(--muted);margin-bottom:12px}
</style>
</head>
<body>
<div class="v-wrap" id="root"></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script src="app/course.js"></script>
<script>
(function () {
  'use strict';

  var root = document.getElementById('root');
  var dlg  = document.getElementById('dlg');
  var dlgBody = document.getElementById('dlgBody');

  var RATE = 1150;

  /* Два отчётных периода. Каждые две недели по их закрытии уходит запрос
     клиенту: подтверждает ли он уроки. Второй период ещё идёт. */
  var PERIODS = [
    { id: 'p1', label: '1–14 октября',  from: '2026-10-01', to: '2026-10-14', closed: true  },
    { id: 'p2', label: '15–28 октября', from: '2026-10-15', to: '2026-10-28', closed: false }
  ];

  var S = { view: 'teacher', client: 's1', log: [] };
  var q = (typeof location === 'undefined' ? '' : location.search);
  if (/view=client/.test(q))  S.view = 'client';
  if (/view=admin/.test(q))   S.view = 'admin';
  if (/student=s\d/.test(q))  S.client = (q.match(/student=(s\d)/) || [])[1] || S.client;

  /* ── мелочи ──────────────────────────────────────────────────────── */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function money(n) { return String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₸'; }
  function initial(name) { var n = String(name || '').trim(); return n ? n[0].toUpperCase() : '?'; }
  function dateRu(iso) {
    if (!iso) return '—';
    var p = String(iso).slice(0, 10).split('-');
    return p[2] + '.' + p[1] + '.' + p[0].slice(2);
  }
  function period(id) { return PERIODS.filter(function (p) { return p.id === id; })[0]; }
  function plural(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    return n + ' ' + (m10 === 1 && m100 !== 11 ? one
      : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? few : many);
  }
  function phoneFmt(p) {
    var d = String(p || '').replace(/\D/g, '');
    return d.length === 11
      ? '+' + d[0] + ' (' + d.slice(1, 4) + ') ' + d.slice(4, 7) + ' ' + d.slice(7, 9) + ' ' + d.slice(9)
      : (p || '—');
  }
  function say(text) {
    var el = document.getElementById('vToast');
    if (!el) return;
    el.textContent = text;
    el.style.display = 'block';
    clearTimeout(say._t);
    say._t = setTimeout(function () { el.style.display = 'none'; }, 3200);
  }
  function log(text) {
    S.log.unshift({ at: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }), text: text });
  }

  /* ── курс компании: готовые уроки, слова и задания ───────────────────
     Учитель не составляет урок с нуля: берёт следующий по счёту урок
     своего уровня из курса — тема, правило, слова и задания уже лежат
     в app/course.js. Именно это снимает с учителя рутину «делать всё
     заново». */
  function levelOf(s) {
    return (window.COURSE.levels || []).filter(function (l) { return l.id === s.level; })[0];
  }
  function plan(s, n) {
    var lv = levelOf(s);
    var L = lv && lv.lessons[n - 1];
    if (!L) return null;
    var c = (window.CONTENT || {})[L.id] || {};
    var words = (c.words || []).map(function (w) { return w.en; });
    var tasks = c.tasks || [];
    var choice = tasks.filter(function (t) { return t.t === 'choice'; }).length;
    var order  = tasks.filter(function (t) { return t.t === 'order'; }).length;
    return {
      id: L.id, n: n, title: L.title, subtitle: L.subtitle, rule: c.rule || '',
      words: words,
      topic: L.title + ' · ' + L.subtitle,
      homework: 'Слова: ' + words.join(', ') + '. Задания: ' + tasks.length +
                ' (' + choice + ' выбор, ' + order + ' сборка предложения).'
    };
  }
  function courseBadge(s) {
    var lv = levelOf(s);
    return lv ? lv.code + ' ' + lv.title : s.level;
  }

  /* ── демо-данные ─────────────────────────────────────────────────────
     Три индивидуальных ученика. Разные уровни, разные даты старта,
     разные ставки и разный период оплаты — ровно то, что на общем
     «гроссбухе» не разглядеть. */
  var TEACHER = {
    name: 'Айгерім Нұрлан', phone: '77015550000', rate: RATE,
    bio: 'Десять лет в школе, пять — онлайн. Готовит к IELTS и ведёт разговорные клубы для подростков.'
  };

  function L(id, periodId, date, courseId, n, teacherDone, client, quality) {
    var s = { id: id, period: periodId, date: date, courseId: courseId,
              topic: null, homework: null,
              teacherDone: !!teacherDone, client: client || null,
              quality: quality || null, note: null, resolved: null };
    return s;
  }

  var STUDENTS = [
    { id: 's1', name: 'Аяжан', phone: '77011234567', level: 'pre-intermediate',
      started: '2026-08-12', days: 'пн, ср, пт', time: '18:00', rate: 1150,
      pay: 'Помесячно, 1-го числа', nextCourse: 6,
      lessons: [
        L('s1a', 'p1', '2026-10-02', 'p3', 3, true, 'yes', 5),
        L('s1b', 'p1', '2026-10-05', 'p3', 3, true, 'yes', 5),
        L('s1c', 'p1', '2026-10-07', 'p4', 4, true, 'yes', 4),
        L('s1d', 'p1', '2026-10-09', 'p4', 4, true, 'yes', 5),
        L('s1e', 'p1', '2026-10-12', 'p5', 5, true, 'no',  null),
        L('s1f', 'p1', '2026-10-14', 'p5', 5, true, 'yes', 5),
        L('s1g', 'p2', '2026-10-16', 'p6', 6, true, null,  null)
      ] },
    { id: 's2', name: 'Тимур', phone: '77029876543', level: 'intermediate',
      started: '2026-09-02', days: 'вт, чт', time: '19:00', rate: 1400,
      pay: 'Каждые две недели', nextCourse: 9,
      lessons: [
        L('s2a', 'p1', '2026-10-01', 'i7', 7, true, null, null),
        L('s2b', 'p1', '2026-10-06', 'i7', 7, true, null, null),
        L('s2c', 'p1', '2026-10-08', 'i8', 8, true, null, null),
        L('s2d', 'p1', '2026-10-13', 'i8', 8, true, null, null),
        L('s2e', 'p2', '2026-10-15', 'i9', 9, true, null, null)
      ] },
    { id: 's3', name: 'Диана', phone: '77031112233', level: 'elementary',
      started: '2026-09-20', days: 'вт, чт, сб', time: '17:00', rate: 1150,
      pay: 'Помесячно, 20-го числа', nextCourse: 4,
      lessons: [
        L('s3a', 'p1', '2026-10-01', 'e2', 2, true,  'yes', 5),
        L('s3b', 'p1', '2026-10-06', 'e2', 2, true,  'yes', 5),
        L('s3c', 'p1', '2026-10-08', 'e3', 3, false, 'yes', 5),
        L('s3d', 'p1', '2026-10-13', 'e3', 3, true,  'yes', 2),
        L('s3e', 'p2', '2026-10-15', 'e4', 4, true,  null,  null)
      ] }
  ];

  /* Темы и домашка в демо-уроках берутся из того же курса, что и кнопка
     «Взять из курса»: на экране лежит настоящая программа компании. */
  STUDENTS.forEach(function (s) {
    s.lessons.forEach(function (l) {
      var p = plan(s, l.courseId ? Number(l.courseId.slice(1)) : 1);
      if (p) { l.topic = p.topic; l.homework = p.homework; }
    });
  });

  log('Демо-данные загружены: 3 ученика, период 1–14 октября закрыт');

  /* ── деньги и расхождения ────────────────────────────────────────── */
  function closed(l) { return period(l.period).closed; }
  function answered(l) { return l.client !== null; }

  /* Начислено — по отметкам учителя. Подтверждено — клиент сказал «да»
     и устроило качество, либо администратор разобрал спор в пользу урока.
     «Не прошёл», низкая оценка и молчание клиента висят на проверке,
     пока администратор не разберётся. */
  function stat(s) {
    var out = { accrued: 0, confirmed: 0, hold: 0, lessons: 0, okCount: 0, disputes: 0 };
    s.lessons.forEach(function (l) {
      if (!l.teacherDone || l.resolved === 'void') return;
      out.lessons++; out.accrued += s.rate;
      var low = l.quality != null && l.quality <= 2;
      var ok = l.resolved === 'paid' || (l.client === 'yes' && l.teacherDone && !low);
      if (ok) { out.confirmed += s.rate; out.okCount++; } else out.hold += s.rate;
      if (l.client === 'no' && !l.resolved) out.disputes++;
    });
    return out;
  }

  /* Очередь проверок. Живёт не в базе, а выводится из данных: админ
     видит каждое расхождение сразу, как только клиент ответил. */
  function tickets() {
    var out = [];
    STUDENTS.forEach(function (s) {
      PERIODS.forEach(function (p) {
        if (!p.closed) return;
        var les = s.lessons.filter(function (l) { return l.period === p.id; });

        var silent = les.filter(function (l) {
          return l.teacherDone && l.client === null && !l.resolved;
        });
        if (silent.length) out.push({ id: 'silent-' + s.id + '-' + p.id, kind: 'silent',
          student: s, period: p, lessons: silent });

        les.forEach(function (l) {
          if (l.resolved) return;
          if (l.teacherDone && l.client === 'no')
            out.push({ id: 'dispute-' + l.id, kind: 'dispute', student: s, period: p, lessons: [l] });
          if (!l.teacherDone && l.client === 'yes')
            out.push({ id: 'ghost-' + l.id, kind: 'ghost', student: s, period: p, lessons: [l] });
          if (l.teacherDone && l.client === 'yes' && l.quality != null && l.quality <= 2)
            out.push({ id: 'quality-' + l.id, kind: 'quality', student: s, period: p, lessons: [l] });
        });
      });
    });
    return out;
  }

  var TICK = {
    silent:  { tag: 'Клиент не ответил', cls: 'hold',
      text: function (t) { return 'За ' + t.period.label + ' учитель отметил ' +
        plural(t.lessons.length, 'урок', 'урока', 'уроков') +
        '. Клиент запрос не подтвердил — начисление висит до его ответа.'; } },
    dispute: { tag: 'Учитель vs клиент', cls: 'bad',
      text: function (t) { var l = t.lessons[0];
        return dateRu(l.date) + ' · ' + l.topic + '. Учитель отметил урок проведённым, ' +
               'клиент ответил «не прошёл». Кто прав — решает администратор.'; } },
    ghost:   { tag: 'Учитель не отметил', cls: 'bad',
      text: function (t) { var l = t.lessons[0];
        return dateRu(l.date) + ' · ' + l.topic + '. Клиент подтвердил урок, ' +
               'а в журнале учителя отметки нет — урок не попал в зарплату.'; } },
    quality: { tag: 'Низкая оценка', cls: 'bad',
      text: function (t) { var l = t.lessons[0];
        return dateRu(l.date) + ' · ' + l.topic + '. Урок подтверждён, но клиент ' +
               'поставил качество ' + l.quality + ' из 5' + (l.note ? ': «' + l.note + '»' : '') + '.'; } }
  };

  function resolve(ticket, how) {
    var paid = how === 'paid';
    ticket.lessons.forEach(function (l) { l.resolved = paid ? 'paid' : 'void'; });
    if (ticket.kind === 'ghost' && paid) ticket.lessons.forEach(function (l) { l.teacherDone = true; });
    var verb = ticket.kind === 'ghost' && paid ? 'урок зачтён' : paid ? 'урок к выплате' : 'начисление снято';
    log(ticket.student.name + ' · ' + ticket.period.label + ' — ' + verb + ' (' + ticket.lessons.length + ' ур.)');
  }
  function writeClient(t) {
    log('Администратор написал клиенту: ' + t.student.name + ' · ' + t.period.label);
  }
  function writeTeacher(t) {
    log('Администратор написал учителю: ' + t.student.name + ' · ' + t.period.label);
  }

  /* ── запрос клиенту ─────────────────────────────────────────────────
     Период, который закрыт, но не подтверждён, — тот, что ждёт ответа.
     Если всё подтверждено, клиент видит текущий период заранее. */
  function requestFor(s) {
    var i;
    for (i = 0; i < PERIODS.length; i++) {
      var p = PERIODS[i];
      var les = s.lessons.filter(function (l) { return l.period === p.id; });
      if (p.closed && les.length && les.some(function (l) { return l.client === null; })) return p;
    }
    for (i = PERIODS.length - 1; i >= 0; i--) {
      var q = PERIODS[i];
      if (s.lessons.some(function (l) { return l.period === q.id; })) return q;
    }
    return PERIODS[PERIODS.length - 1];
  }
  function letter(s, p) {
    var n = s.lessons.filter(function (l) { return l.period === p.id && l.teacherDone; }).length;
    return '1English · ' + s.name + '. Учитель ' + TEACHER.name + ' отметил ' +
      plural(n, 'урок', 'урока', 'уроков') + ' за ' + p.label + '. Подтвердите, что уроки прошли ' +
      'и содержание устраивает: ' +
      'короткая ссылка в SMS и WhatsApp. Ответ — один раз в две недели, занимает минуту. ' +
      'Если урок не прошёл или что-то не устроило — так и отметьте, администратор проверит.';
  }

  /* ── экран ────────────────────────────────────────────────────────── */
  function render() {
    root.innerHTML =
      '<div class="v-top">' +
        '<h1>Контроль уроков</h1>' +
        '<div class="v-tabs">' +
          '<button data-view="teacher"' + (S.view === 'teacher' ? ' class="on"' : '') + '>Учитель</button>' +
          '<button data-view="client"'  + (S.view === 'client'  ? ' class="on"' : '') + '>Клиент</button>' +
          '<button data-view="admin"'   + (S.view === 'admin'   ? ' class="on"' : '') + '>Администратор</button>' +
        '</div>' +
      '</div>' +
      '<div class="v-note">Демо на выдуманных данных: страница ничего не отправляет и никуда не пишет. ' +
        'Темы, слова и домашние задания в уроках — <b>настоящая программа компании</b> из app/course.js: ' +
        'учитель берёт готовый урок, а не составляет его с нуля. Каждые две недели клиент получает ' +
        'запрос и подтверждает уроки — <b>зарплата учителя считается от этих подтверждений</b>.</div>' +
      '<div id="vToast" class="v-note" style="display:none;background:var(--ok-soft);color:var(--ok)"></div>' +
      (S.view === 'teacher' ? viewTeacher()
       : S.view === 'client' ? viewClient()
       : viewAdmin());

    Array.prototype.forEach.call(root.querySelectorAll('[data-view]'), function (b) {
      b.onclick = function () { S.view = b.getAttribute('data-view'); render(); };
    });
    if (S.view === 'teacher') wireTeacher();
    if (S.view === 'client')  wireClient();
    if (S.view === 'admin')   wireAdmin();
  }
  function each(sel, fn) { Array.prototype.forEach.call(root.querySelectorAll(sel), fn); }

  /* ── учитель ──────────────────────────────────────────────────────── */
  function viewTeacher() {
    var all = { lessons: 0, confirmed: 0, hold: 0 };
    STUDENTS.forEach(function (s) {
      var st = stat(s); all.lessons += st.accrued; all.confirmed += st.confirmed; all.hold += st.hold;
    });

    return '<div class="v-card">' +
        '<h3>' + esc(TEACHER.name) + '</h3>' +
        '<div class="hint">' + esc(phoneFmt(TEACHER.phone)) + ' · ставка ' + money(TEACHER.rate) +
          ' за урок · ' + esc(TEACHER.bio) + '</div>' +
        '<div class="v-kpis" style="margin-bottom:0">' +
          '<div class="v-kpi"><b>' + STUDENTS.length + '</b><span>учеников</span></div>' +
          '<div class="v-kpi"><b>' + money(all.lessons) + '</b><span>начислено по журналу</span></div>' +
          '<div class="v-kpi"><b>' + money(all.confirmed) + '</b><span>подтверждено клиентами</span></div>' +
          '<div class="v-kpi' + (all.hold ? ' hot' : '') + '"><b>' + money(all.hold) + '</b><span>на проверке — пока не выплачено</span></div>' +
        '</div>' +
      '</div>' +
      STUDENTS.map(teacherRow).join('') +
      '<div class="v-card"><h3>Как это работает</h3>' +
        '<div class="hint" style="margin-bottom:0">' +
          '1. Ученик заводится администратором: уровень, дата старта, дни, ставка и период оплаты.<br>' +
          '2. Уроки берутся из курса компании кнопкой «Взять из курса» — тема, слова и задания готовы.<br>' +
          '3. После занятия учитель ставит отметку «проведён» — она и есть основание для зарплаты.<br>' +
          '4. Раз в две недели клиент подтверждает уроки. Подтверждённое уходит в выплату, ' +
          'спорное администратор разбирает вручную.' +
        '</div></div>';
  }

  function teacherRow(s) {
    var st = stat(s);
    return '<div class="v-card">' +
      '<div class="v-who">' +
        '<span class="ava">' + esc(initial(s.name)) + '</span>' +
        '<span><b>' + esc(s.name) + '</b><span class="ph">' + esc(phoneFmt(s.phone)) + '</span></span>' +
        '<span class="v-tags">' +
          '<span class="v-tag">' + esc(courseBadge(s)) + '</span>' +
          '<span class="v-tag">старт ' + dateRu(s.started) + '</span>' +
          '<span class="v-tag">' + money(s.rate) + ' за урок</span>' +
          '<span class="v-tag g">' + esc(s.pay) + '</span>' +
        '</span>' +
      '</div>' +
      '<div class="v-meta">График: <i>' + esc(s.days) + ', ' + esc(s.time) + '</i> · ' +
        'в курсе: <i>урок ' + s.nextCourse + ' из 14</i> · ' +
        'начислено <i>' + money(st.accrued) + '</i>, подтверждено <i>' + money(st.confirmed) + '</i>, ' +
        'на проверке <i>' + money(st.hold) + '</i></div>' +
      PERIODS.map(function (p) {
        var les = s.lessons.filter(function (l) { return l.period === p.id; });
        if (!les.length) return '';
        return '<div style="margin-bottom:8px"><div class="v-tag" style="display:inline-block;margin-bottom:6px">' +
          esc(p.label) + (p.closed ? '' : ' · идёт') + '</div>' +
          les.map(function (l) { return lesLine(s, l); }).join('') + '</div>';
      }).join('') +
      '<div class="v-acts"><button class="v-btn" data-plan="' + esc(s.id) + '">Взять следующий урок из курса</button></div>' +
    '</div>';
  }

  function lesLine(s, l) {
    var pill;
    if (l.client === 'no')                    pill = '<span class="v-pill bad">клиент: не прошёл</span>';
    else if (l.client === 'yes' && !l.teacherDone) pill = '<span class="v-pill bad">клиент подтвердил, отметки нет</span>';
    else if (l.client === 'yes' && l.quality <= 2) pill = '<span class="v-pill bad">качество ' + l.quality + '/5</span>';
    else if (l.client === 'yes')              pill = '<span class="v-pill ok">подтверждён</span>';
    else if (closed(l))                       pill = '<span class="v-pill hold">ждём клиента</span>';
    else                                      pill = '<span class="v-pill wait">период не закрыт</span>';
    if (l.resolved === 'paid')  pill = '<span class="v-pill ok">к выплате</span>';
    if (l.resolved === 'void')  pill = '<span class="v-pill bad">снят</span>';

    return '<div class="v-les' + (l.teacherDone ? '' : ' off') + '">' +
      '<input type="checkbox" data-done="' + esc(l.id) + '"' + (l.teacherDone ? ' checked' : '') +
        ' title="Урок проведён — отметка учителя">' +
      '<span class="d">' + dateRu(l.date) + '</span>' +
      '<span class="tp' + (l.topic ? '' : ' empty') + '" title="' + esc(l.homework || '') + '">' +
        esc(l.topic || 'тема не задана') + '</span>' + pill +
      '</div>';
  }

  function wireTeacher() {
    each('[data-done]', function (b) {
      b.onchange = function () {
        var l = findLesson(b.getAttribute('data-done'));
        l.teacherDone = b.checked;
        log('Учитель ' + (b.checked ? 'отметил урок' : 'снял отметку') + ': ' + l.student.name + ' · ' + dateRu(l.date));
        render(); say(b.checked ? 'Урок отмечен' : 'Отметка снята');
      };
    });
    each('[data-plan]', function (b) {
      b.onclick = function () { planDialog(byId(b.getAttribute('data-plan'))); };
    });
  }

  /* Окно готового урока: что лежит в курсе и что уйдёт в журнал. */
  function planDialog(s) {
    var p = plan(s, s.nextCourse);
    if (!p) return;
    open('<h3>' + esc(courseBadge(s)) + ' · урок ' + p.n + ' из 14</h3>' +
      '<div class="sub">' + esc(s.name) + ' · следующий урок в курсе компании. ' +
        'Всё ниже уже снято с методички — учителю остаётся провести занятие.</div>' +
      '<div style="font-size:16px;font-weight:800;margin-bottom:2px">' + esc(p.title) + '</div>' +
      '<div style="font-size:13.5px;color:var(--muted);margin-bottom:12px">' + esc(p.subtitle) + '</div>' +
      '<div class="v-rule">' + esc(p.rule) + '</div>' +
      '<div style="font-size:12px;font-weight:700;color:var(--muted)">Слова урока</div>' +
      '<div class="v-words">' + p.words.map(function (w) { return '<span>' + esc(w) + '</span>'; }).join('') + '</div>' +
      '<div class="sub" style="margin-bottom:0">В журнал урока ' + p.n + ' ляжет тема ' +
        '«' + esc(p.topic) + '» и домашка из слов и заданий курса.</div>' +
      '<div class="dlg-foot"><button id="no">Закрыть</button>' +
        '<button class="go" id="ok">Взять в журнал</button></div>');
    dlgBody.querySelector('#no').onclick = close;
    dlgBody.querySelector('#ok').onclick = function () {
      var target = s.lessons.filter(function (l) { return !l.teacherDone; })[0];
      if (!target) target = s.lessons[s.lessons.length - 1];
      target.topic = p.topic; target.homework = p.homework; target.courseId = p.id;
      s.nextCourse = Math.min(p.n + 1, 14);
      log('Учитель взял из курса: ' + s.name + ' · урок ' + p.n + ' «' + p.title + '»');
      close(); render(); say('Урок ' + p.n + ' подставлен в журнал');
    };
  }

  /* ── клиент ───────────────────────────────────────────────────────── */
  function viewClient() {
    var s = byId(S.client);
    var p = requestFor(s);
    var les = s.lessons.filter(function (l) { return l.period === p.id; });
    var anyAnswer = les.some(function (l) { return l.client !== null; });

    return '<div class="v-card">' +
        '<h3>Что приходит клиенту</h3>' +
        '<div class="hint">Раз в две недели, после закрытия периода. Канал — SMS и WhatsApp, ' +
          'ссылка ведёт на этот же экран в личном кабинете.</div>' +
        '<select id="vPick" style="background:var(--bg);border:0;border-radius:12px;padding:10px 14px;' +
          'font:inherit;font-size:14px;color:var(--ink);margin-bottom:14px">' +
          STUDENTS.map(function (x) {
            return '<option value="' + esc(x.id) + '"' + (x.id === s.id ? ' selected' : '') + '>' +
              esc(x.name) + ' · ' + esc(courseBadge(x)) + '</option>';
          }).join('') +
        '</select>' +
        '<div class="v-letter"><div class="from">Уведомление · ' + esc(p.label) + '</div>' +
          esc(letter(s, p)) + '</div>' +
        '<h3 style="margin-bottom:2px">' + esc(s.name) + ' · ' + esc(p.label) + '</h3>' +
        '<div class="hint">' + (p.closed
          ? 'Период закрыт — администратор ждёт ответа.'
          : 'Период ещё идёт: ответить можно заранее, список пополнится.') + '</div>' +
        les.map(function (l) { return ansLine(l); }).join('') +
        '<textarea class="v-note-f" id="vNote" placeholder="Комментарий для администратора: что не так, если что-то не так">' +
          esc(s.lessons.filter(function (l) { return l.note; }).map(function (l) { return l.note; }).join(' · ')) +
        '</textarea>' +
        '<div class="v-acts"><button class="v-btn" id="vSend">' +
          (anyAnswer ? 'Обновить ответ' : 'Отправить ответ') + '</button></div>' +
      '</div>' +
      '<div class="v-card"><h3>Правила подтверждения</h3>' +
        '<div class="hint" style="margin-bottom:0">' +
          'Клиент видит только то, что отметил учитель: дату и тему урока. Отвечает «прошёл / не прошёл» ' +
          'и ставит качество от 1 до 5. Всё, что клиент подтвердил, уходит учителю в зарплату; ' +
          'спорное и без ответа висит на проверке, пока администратор не разберётся.' +
        '</div></div>';
  }

  function ansLine(l) {
    return '<div class="v-ans">' +
      '<span class="d">' + dateRu(l.date) + '</span>' +
      '<span class="tp">' + esc(l.topic) + '</span>' +
      '<span class="seg">' +
        '<button data-ans="' + esc(l.id) + '" data-v="yes" class="' + (l.client === 'yes' ? 'on' : '') + '">Прошёл</button>' +
        '<button data-ans="' + esc(l.id) + '" data-v="no" class="' + (l.client === 'no' ? 'on no' : '') + '">Не прошёл</button>' +
      '</span>' +
      (l.client === 'yes'
        ? '<span class="q">' + [1, 2, 3, 4, 5].map(function (n) {
            return '<button data-q="' + esc(l.id) + '" data-n="' + n + '" class="' +
              (l.quality === n ? 'on' + (n <= 2 ? ' low' : '') : '') + '">' + n + '</button>';
          }).join('') + '</span>'
        : '') +
      '</div>';
  }

  function wireClient() {
    var pick = root.querySelector('#vPick');
    if (pick) pick.onchange = function () { S.client = pick.value; render(); };
    each('[data-ans]', function (b) {
      b.onclick = function () {
        var l = findLesson(b.getAttribute('data-ans'));
        l.client = b.getAttribute('data-v');
        if (l.client === 'yes' && !l.quality) l.quality = 5;
        render();
      };
    });
    each('[data-q]', function (b) {
      b.onclick = function () {
        findLesson(b.getAttribute('data-q')).quality = Number(b.getAttribute('data-n'));
        render();
      };
    });
    var send = root.querySelector('#vSend');
    if (send) send.onclick = function () {
      var s = byId(S.client), p = requestFor(s);
      var note = root.querySelector('#vNote').value.trim();
      var les = s.lessons.filter(function (l) { return l.period === p.id; });
      var ok = les.filter(function (l) { return l.client === 'yes'; }).length;
      var no = les.filter(function (l) { return l.client === 'no'; }).length;
      les.forEach(function (l) { l.note = note || null; });
      log('Клиент ' + s.name + ' ответил за ' + p.label + ': подтвердил ' + ok +
          (no ? ', отверг ' + no : '') + (note ? ', комментарий есть' : ''));
      render();
      say('Ответ отправлен' + (no || note ? '. Администратор разберёт отмеченные уроки' : ''));
    };
  }

  /* ── администратор ────────────────────────────────────────────────── */
  function viewAdmin() {
    var tk = tickets();
    var all = { confirmed: 0, hold: 0 };
    STUDENTS.forEach(function (s) {
      var st = stat(s);
      all.confirmed += st.confirmed; all.hold += st.hold;
    });

    return '<div class="v-kpis">' +
        '<div class="v-kpi"><b>' + STUDENTS.reduce(function (a, s) {
          return a + PERIODS.filter(function (p) {
            return p.closed && s.lessons.some(function (l) { return l.period === p.id; });
          }).length;
        }, 0) + '</b><span>запросов ушло клиентам</span></div>' +
        '<div class="v-kpi"><b>' + money(all.confirmed) + '</b><span>подтверждено к выплате</span></div>' +
        '<div class="v-kpi' + (all.hold ? ' hot' : '') + '"><b>' + money(all.hold) + '</b><span>на проверке</span></div>' +
        '<div class="v-kpi' + (tk.length ? ' hot' : '') + '"><b>' + tk.length + '</b><span>расхождений в очереди</span></div>' +
      '</div>' +

      '<div class="v-card"><h3>Единый дашборд: что делает учитель</h3>' +
        '<div class="hint">Одна строка — один ученик. Уровень, дата старта, ставка и период оплаты свои у каждого: ' +
          'на общем списке они и терялись.</div>' +
        '<div class="scrollx"><table><thead><tr>' +
          '<th>Ученик</th><th>Уровень</th><th>Старт</th><th>Период оплаты</th>' +
          '<th class="num">В журнале</th><th class="num">Подтверждено</th><th class="num">Спор</th>' +
          '<th class="num">К выплате</th><th class="num">На проверке</th>' +
        '</tr></thead><tbody>' +
        STUDENTS.map(function (s) {
          var st = stat(s);
          return '<tr><td><b>' + esc(s.name) + '</b><br><span style="color:var(--muted);font-size:12px">' +
              esc(TEACHER.name) + '</span></td>' +
            '<td>' + esc(courseBadge(s)) + '</td>' +
            '<td>' + dateRu(s.started) + '</td>' +
            '<td>' + esc(s.pay) + ' · ' + money(s.rate) + '</td>' +
            '<td class="num">' + st.lessons + '</td>' +
            '<td class="num">' + st.okCount + ' из ' + st.lessons + '</td>' +
            '<td class="num">' + (st.disputes || '—') + '</td>' +
            '<td class="num">' + money(st.confirmed) + '</td>' +
            '<td class="num">' + (st.hold ? money(st.hold) : '—') + '</td></tr>';
        }).join('') +
        '</tbody><tfoot><tr><td colspan="7">Итого</td>' +
          '<td class="num">' + money(all.confirmed) + '</td>' +
          '<td class="num">' + money(all.hold) + '</td></tr></tfoot></table></div></div>' +

      '<div class="v-card"><h3>На проверку</h3>' +
        '<div class="hint">Расхождения между журналом учителя и ответом клиента. ' +
          'Пока администратор не разберётся, уроки из этой панели не выплачиваются.</div>' +
        (tk.length ? tk.map(ticketHtml).join('') :
          '<div class="v-empty">Расхождений нет: все закрытые периоды подтверждены клиентами.</div>') +
      '</div>' +

      '<div class="v-card"><h3>Журнал действий</h3>' +
        '<div class="v-log">' + (S.log.length ? S.log.slice(0, 12).map(function (r) {
          return '<div><b>' + esc(r.at) + '</b> · ' + esc(r.text) + '</div>';
        }).join('') : '<div>Пока пусто</div>') + '</div></div>';
  }

  function ticketHtml(t) {
    var k = TICK[t.kind];
    var sum = t.lessons.reduce(function (a, l) { return a + t.student.rate; }, 0);
    return '<div class="v-tick"><div class="hd">' +
        '<span class="v-pill ' + k.cls + '">' + esc(k.tag) + '</span>' +
        '<b>' + esc(t.student.name) + ' · ' + esc(t.period.label) + '</b>' +
        '<span style="color:var(--muted);font-size:13px">' + esc(courseBadge(t.student)) + '</span>' +
      '</div>' +
      '<p>' + esc(k.text(t)) + (t.kind === 'silent' ? '' : ' <span class="sum">' + money(sum) + '</span>') + '</p>' +
      '<div class="v-acts" style="margin-top:0">' +
        (t.kind === 'silent'
          ? '<button class="v-mini" data-pay="' + esc(t.id) + '">Считать по журналу учителя</button>' +
            '<button class="v-mini bad" data-void="' + esc(t.id) + '">Снять уроки до ответа клиента</button>'
          : '<button class="v-mini" data-pay="' + esc(t.id) + '">' +
              (t.kind === 'ghost' ? 'Зачесть урок' : 'Урок состоялся — к выплате') + '</button>' +
            '<button class="v-mini bad" data-void="' + esc(t.id) + '">' +
              (t.kind === 'quality' ? 'Вернуть урок учителю' : 'Урока не было — снять') + '</button>') +
        '<button class="v-mini" data-wc="' + esc(t.id) + '">Написать клиенту</button>' +
        '<button class="v-mini" data-wt="' + esc(t.id) + '">Написать учителю</button>' +
      '</div></div>';
  }

  function wireAdmin() {
    each('[data-pay]',  function (b) { b.onclick = function () { resolve(byTicket(b.getAttribute('data-pay')), 'paid');  render(); say('Разобрано: урок к выплате'); }; });
    each('[data-void]', function (b) { b.onclick = function () { resolve(byTicket(b.getAttribute('data-void')), 'void'); render(); say('Разобрано: начисление снято'); }; });
    each('[data-wc]',   function (b) { b.onclick = function () { writeClient(byTicket(b.getAttribute('data-wc'))); render(); say('Сообщение клиенту отправлено'); }; });
    each('[data-wt]',   function (b) { b.onclick = function () { writeTeacher(byTicket(b.getAttribute('data-wt'))); render(); say('Сообщение учителю отправлено'); }; });
  }

  /* ── окна и поиск ─────────────────────────────────────────────────── */
  function open(html) { dlgBody.innerHTML = html; if (!dlg.open) dlg.showModal(); }
  function close() { dlg.close(); }
  function byId(id) { return STUDENTS.filter(function (s) { return s.id === id; })[0]; }
  function findLesson(id) {
    var found = null;
    STUDENTS.forEach(function (s) {
      s.lessons.forEach(function (l) { if (l.id === id) { l.student = s; found = l; } });
    });
    return found;
  }
  function byTicket(id) { return tickets().filter(function (t) { return t.id === id; })[0]; }

  /* Цифры и очередь расхождений доступны проверке app/check_proverka.mjs —
     там же, в vm, без браузера. */
  window.PROVERKA = { students: STUDENTS, periods: PERIODS, stat: stat, tickets: tickets,
                      plan: plan, requestFor: requestFor, letter: letter, TICK: TICK,
                      resolve: resolve, writeClient: writeClient, byId: byId, render: render };

  render();
})();
</script>
</body>
</html>
