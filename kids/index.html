<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF3D1">
<meta name="robots" content="noindex">
<title>1English Kids · Forest English</title>
<link rel="icon" href="../assets/logo.png">
<link rel="apple-touch-icon" href="../assets/logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="1English Kids">
<style>
@font-face{font-family:'Golos Text';font-weight:400 900;font-display:swap;src:url('../assets/fonts/GolosText-cyrillic-ext.woff2') format('woff2');unicode-range:U+0460-052F,U+1C80-1C88,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F}
@font-face{font-family:'Golos Text';font-weight:400 900;font-display:swap;src:url('../assets/fonts/GolosText-cyrillic.woff2') format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Golos Text';font-weight:400 900;font-display:swap;src:url('../assets/fonts/GolosText-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
:root{
  --bg:#FFF3D1; --card:#FFFFFF; --ink:#22313F; --muted:#6F7A86;
  --leaf:#2F8F5B; --leaf-dk:#1F6B42; --sun:#FFB627; --berry:#F2545B; --sky:#4BA3E3;
  --r:26px; --sh:0 4px 0 rgba(34,49,63,.10), 0 14px 30px rgba(34,49,63,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.4 'Golos Text',system-ui,sans-serif}
body{min-height:100vh;background:
  radial-gradient(120px 120px at 8% 4%, #FFE39A 0 60%, transparent 61%),
  radial-gradient(90px 90px at 96% 14%, #FFE39A 0 60%, transparent 61%), var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block;max-width:100%}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 40px)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.top .logo{width:42px;height:42px;border-radius:14px;background:#fff;box-shadow:var(--sh);display:grid;place-items:center}
.top .logo img{width:30px}
.top .grow{flex:1;min-width:0}
.top b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.top span{font-size:14px;color:var(--muted)}
.lang{display:flex;background:#fff;border-radius:999px;padding:4px;box-shadow:var(--sh)}
.lang button{padding:6px 11px;border-radius:999px;font-size:13px;font-weight:800;color:var(--muted)}
.lang button.on{background:var(--leaf);color:#fff}
.stars{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:8px 14px 8px 10px;
  font-weight:800;box-shadow:var(--sh)}
.star{width:22px;height:22px;flex:none}
h1{font-size:30px;line-height:1.1;letter-spacing:-.03em;margin:4px 0 8px;font-weight:900}
h2{font-size:22px;letter-spacing:-.02em;margin:26px 0 12px;font-weight:900}
.sub{color:var(--muted);margin:0 0 18px}
.big{display:block;width:100%;padding:18px;border-radius:999px;background:var(--leaf);color:#fff;font-size:20px;font-weight:900;
  box-shadow:0 5px 0 var(--leaf-dk);transition:transform .12s}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--leaf-dk)}
.big.sun{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 #C98A0B}
.big[disabled]{opacity:.45}
.field{width:100%;padding:18px 20px;border-radius:20px;border:3px solid #F2DFA6;background:#fff;font:700 20px 'Golos Text',sans-serif;
  color:var(--ink);outline:none;margin:6px 0 14px}
.field:focus{border-color:var(--leaf)}
.hero{border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);margin:6px 0 20px;position:relative;background:#cfe8d6}
.hero img{width:100%;aspect-ratio:16/9;object-fit:cover}
.gift{position:absolute;left:14px;bottom:14px;background:var(--berry);color:#fff;border-radius:999px;padding:8px 14px;font-weight:900;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ep{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--sh);text-align:left;position:relative;transition:transform .12s}
.ep:active{transform:scale(.97)}
.ep img{width:100%;aspect-ratio:16/10;object-fit:cover;background:#cfe8d6}
.ep .t{padding:10px 12px 12px}
.ep .t b{display:block;font-size:15px;line-height:1.2;font-weight:800}
.ep .t span{font-size:13px;color:var(--muted)}
.ep .n{position:absolute;top:8px;left:8px;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:900;font-size:15px}
.ep .got{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:var(--sun);display:grid;place-items:center}
.ep.next{outline:4px solid var(--sun);outline-offset:-4px}
.ep.next::after{content:'';position:absolute;inset:0;border-radius:22px;box-shadow:0 0 0 0 rgba(255,182,39,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(255,182,39,0)}100%{box-shadow:0 0 0 0 rgba(255,182,39,0)}}
.back{width:48px;height:48px;border-radius:16px;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;flex:none}
.player{border-radius:var(--r);overflow:hidden;background:#000;box-shadow:var(--sh)}
.player video{width:100%;display:block;aspect-ratio:16/9;background:#000}
.words{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.w{display:block;width:100%;padding:0;height:118px;perspective:800px}
.w .in{display:block;position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.32,.72,0,1);transform-style:preserve-3d}
.w.flip .in{transform:rotateY(180deg)}
.w .f{position:absolute;inset:0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--sh);padding:8px;text-align:center}
.w .f.a{background:#fff}
.w .f.b{background:var(--sky);color:#fff;transform:rotateY(180deg)}
.w .f b{font-size:24px;font-weight:900;letter-spacing:-.02em}
.w .f span{font-size:13px;color:var(--muted);margin-top:4px}
.w .f.b b{font-size:22px}
.w:nth-child(4n+2) .f.b{background:var(--leaf)} .w:nth-child(4n+3) .f.b{background:var(--berry)} .w:nth-child(4n) .f.b{background:#9B6BDF}
.thanks{margin-top:28px;background:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--sh);text-align:center}
.thanks p{margin:0 0 14px;font-weight:700}
.msg{text-align:center;padding-top:12vh}
.msg h1{font-size:26px}
.toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-140%);background:var(--ink);color:#fff;padding:14px 22px;border-radius:999px;
  font-weight:800;z-index:9;transition:transform .35s cubic-bezier(.32,.72,0,1);display:flex;gap:8px;align-items:center}
.toast.on{transform:translate(-50%,0)}
.demo{background:#22313F;color:#fff;text-align:center;font-size:13px;padding:6px}
.err{color:var(--berry);font-weight:700;min-height:1.2em;margin:0 0 10px}
.field.code{text-transform:uppercase;letter-spacing:.12em}
.langpick{min-height:90vh;display:flex;flex-direction:column;justify-content:center;gap:16px}
.langpick img{width:84px;margin:0 auto 18px;border-radius:24px;background:#fff;padding:14px;box-shadow:var(--sh)}
.big:disabled{opacity:.55}
@media (min-width:720px){.grid{grid-template-columns:1fr 1fr 1fr}.app{max-width:820px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<script src="../app/db.js"></script>
<script src="../app/course.js"></script>
<script src="../app/family.js"></script>
<script>
(function () {
'use strict';
var F = FAM.make('kid'), S = F.S, app = document.getElementById('app'), esc = FAM.esc;
var IDS = Object.keys(window.CARTOONS || {}).sort(function (a, b) { return +a.slice(1) - +b.slice(1); });

var T = {
  kk: { hi: 'Сәлем', giftFrom: function (n) { return n ? n + ' саған сыйлық жасады' : 'Саған сыйлық'; },
        lead: 'Ағылшын тілін мультфильммен үйрен: орман достары, жаңа сөздер және жұлдыздар.',
        name: 'Атың кім?', namePh: 'Мысалы: Айсұлу', code: 'Промокод', codePh: 'ABCD-EFGH', start: 'Бастау!',
        codeNote: 'Промокод сілтемеде болды. Сілтемесіз кірсең, оны сыйлық жасаған адамнан сұра.',
        errName: 'Атыңды жаз', errCode: 'Промокод қате. Сыйлық жасаған адамнан қайта сұра.',
        errTaken: 'Бұл промокодпен балалар платформасы басқа балаға бекітілген. Өзің бұрын кірсең, атыңды сол кездегідей жаз.',
        errNet: 'Интернет жоқ. Желіге қосылып, қайта бас.',
        errServer: 'Қызмет уақытша істемей тұр. Кейінірек қайта бас.',
        stars: function (a, b) { return a + ' / ' + b; }, next: 'Келесі мультфильм',
        words: 'Сөздер', tapWord: 'Сөзді бас: тыңдайсың, сосын аудармасы шығады',
        gotStar: 'Жұлдыз алдың!', thanks: function (n) { return (n || 'Сыйлық жасаған адам') + ' қуансын: рахмет айт!'; },
        thanksBtn: 'Рахмет айту', thanked: function (n) { return 'Рахмет жіберілді. ' + (n || '') + ' оны кабинетінен көреді.'; },
        ep: 'Мультфильм', wait: 'Бір секунд…' },
  ru: { hi: 'Привет', giftFrom: function (n) { return n ? n + ' сделал(а) тебе подарок' : 'Тебе подарок'; },
        lead: 'Учи английский по мультикам: лесные друзья, новые слова и звёзды.',
        name: 'Как тебя зовут?', namePh: 'Например: Айсулу', code: 'Промокод', codePh: 'ABCD-EFGH', start: 'Начать!',
        codeNote: 'Промокод был в ссылке. Если входишь без ссылки, спроси его у того, кто подарил.',
        errName: 'Напиши своё имя', errCode: 'Промокод неверный. Спроси его ещё раз у того, кто подарил.',
        errTaken: 'Детская платформа по этому промокоду уже закреплена за другим ребёнком. Если входил раньше, напиши имя так же, как тогда.',
        errNet: 'Нет интернета. Подключись и нажми ещё раз.',
        errServer: 'Сервис временно не работает. Попробуй чуть позже.',
        stars: function (a, b) { return a + ' / ' + b; }, next: 'Следующий мультик',
        words: 'Слова', tapWord: 'Нажми на слово: услышишь его, потом увидишь перевод',
        gotStar: 'Ты получил звезду!', thanks: function (n) { return 'Порадуй ' + (n || 'того, кто подарил') + ': скажи спасибо!'; },
        thanksBtn: 'Сказать спасибо', thanked: function (n) { return 'Спасибо отправлено. ' + (n || '') + ' увидит его в своём кабинете.'; },
        ep: 'Мультик', wait: 'Секунду…' }
};
function t(k) { return (T[S.lang] || T.kk)[k]; }

var STAR = '<svg class="star" viewBox="0 0 24 24"><path d="M12 2.6l2.9 6 6.5.8-4.8 4.5 1.2 6.5L12 17.3l-5.8 3.1 1.2-6.5L2.6 9.4l6.5-.8z" fill="#FFB627" stroke="#C98A0B" stroke-width="1.2" stroke-linejoin="round"/></svg>';
var BACK = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>';

function title(id) {
  var c = (window.CONTENT || {})[id] || {};
  return S.lang === 'kk' ? (c.subtitleKk || c.subtitle || c.title || '') : (c.subtitle || c.title || '');
}
function toast(html) {
  var el = document.getElementById('toast');
  el.innerHTML = html; el.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('on'); }, 2600);
}
function top(withStars) {
  return '<div class="top"><div class="logo"><img src="../assets/logo.png" alt=""></div>' +
    '<div class="grow"><b>Forest English</b><span>1English Kids</span></div>' +
    (withStars ? '<span class="stars">' + STAR + t('stars')(S.seen.length, IDS.length) + '</span>' : '') +
    '<div class="lang"><button data-l="kk"' + (S.lang === 'kk' ? ' class="on"' : '') + '>KZ</button>' +
    '<button data-l="ru"' + (S.lang === 'ru' ? ' class="on"' : '') + '>RU</button></div></div>';
}
function paint(html) {
  app.innerHTML = html; window.scrollTo(0, 0);
  Array.prototype.forEach.call(app.querySelectorAll('[data-l]'), function (b) {
    b.onclick = function () { S.lang = b.getAttribute('data-l'); F.save(); route(); };
  });
}

/* Язык — самым первым экраном, до всего остального. */
function scrLang() {
  app.innerHTML = '<div class="langpick"><img src="../assets/logo.png" alt="">' +
    '<button class="big" data-pick="kk">Қазақша</button><button class="big sun" data-pick="ru">Русский</button></div>';
  Array.prototype.forEach.call(app.querySelectorAll('[data-pick]'), function (b) {
    b.onclick = function () { S.lang = b.getAttribute('data-pick'); F.save(); route(); };
  });
}

function scrLogin() {
  paint(top(false) +
    '<div class="hero"><img src="../media/cartoon/b1.jpg" alt="">' + (F.linkCode ? '<span class="gift">' + esc(t('giftFrom')('')) + '</span>' : '') + '</div>' +
    '<h1>' + t('hi') + '!</h1><p class="sub">' + t('lead') + '</p>' +
    '<label><b>' + t('name') + '</b><input class="field" id="nm" maxlength="30" autocomplete="given-name" placeholder="' + t('namePh') + '" value="' + esc(S.name || '') + '"></label>' +
    '<label><b>' + t('code') + '</b><input class="field code" id="cd" maxlength="9" autocapitalize="characters" autocomplete="off" placeholder="' + t('codePh') + '" value="' + esc(F.linkCode ? F.linkCode.slice(0, 4) + '-' + F.linkCode.slice(4) : '') + '"></label>' +
    (F.linkCode ? '' : '<p class="sub" style="margin-top:-6px">' + t('codeNote') + '</p>') +
    '<p class="err" id="er"></p><button class="big" id="go">' + t('start') + '</button>');
  var go = document.getElementById('go'), er = document.getElementById('er');
  go.onclick = function () {
    go.disabled = true; er.textContent = '';
    F.enter(document.getElementById('cd').value, document.getElementById('nm').value).then(function (r) {
      go.disabled = false;
      if (r.ok) { location.replace('#/'); return route(); }
      er.textContent = t({ name: 'errName', taken: 'errTaken', net: 'errNet', server: 'errServer' }[r.reason] || 'errCode');
    });
  };
}

function scrHome() {
  var nextId = IDS.filter(function (id) { return S.seen.indexOf(id) < 0; })[0];
  paint(top(true) +
    '<h1>' + t('hi') + ', ' + esc(S.name) + '!</h1><p class="sub">' + t('lead') + '</p>' +
    '<div class="grid">' + IDS.map(function (id, i) {
      var c = CARTOONS[id], got = S.seen.indexOf(id) >= 0;
      return '<button class="ep' + (id === nextId ? ' next' : '') + '" data-ep="' + id + '">' +
        '<img src="../' + c.poster + '" alt="" loading="lazy"><span class="n">' + (i + 1) + '</span>' +
        (got ? '<span class="got">' + STAR + '</span>' : '') +
        '<span class="t"><b>' + esc(title(id)) + '</b><span>' + t('ep') + ' ' + (i + 1) + '</span></span></button>';
    }).join('') + '</div>' + thanksCard());
  Array.prototype.forEach.call(app.querySelectorAll('[data-ep]'), function (b) {
    b.onclick = function () { location.hash = '#/ep/' + b.getAttribute('data-ep'); };
  });
  wireThanks();
}

function thanksCard() {
  return '<div class="thanks"><p>' + esc(t('thanks')(F.owner())) + '</p>' +
    '<button class="big sun" id="ty">' + t('thanksBtn') + '</button></div>';
}
function wireThanks() {
  var b = document.getElementById('ty'); if (!b) return;
  b.onclick = function () {
    b.disabled = true;
    F.thank('thanks').then(function () { toast(esc(t('thanked')(F.owner()))); });
  };
}

function scrEp(id) {
  var c = CARTOONS[id]; if (!c) { location.replace('#/'); return; }
  var i = IDS.indexOf(id), nextId = IDS[i + 1];
  var words = (((window.CONTENT || {})[id] || {}).words || []).slice(0, 8);
  paint('<div class="top"><button class="back" id="bk" aria-label="back">' + BACK + '</button>' +
      '<div class="grow"><b>' + esc(title(id)) + '</b><span>' + t('ep') + ' ' + (i + 1) + '</span></div>' +
      '<span class="stars">' + STAR + t('stars')(S.seen.length, IDS.length) + '</span></div>' +
    '<div class="player"><video id="v" controls playsinline preload="metadata" poster="../' + c.poster + '" src="../' + c.src + '"></video></div>' +
    (words.length ? '<h2>' + t('words') + '</h2><p class="sub">' + t('tapWord') + '</p><div class="words">' +
      words.map(function (w, k) {
        return '<button class="w" data-w="' + k + '"><span class="in">' +
          '<span class="f a"><b>' + esc(w.en) + '</b></span>' +
          '<span class="f b"><b>' + esc(S.lang === 'ru' ? w.ru : (w.kk || w.ru)) + '</b><span style="color:#fff;opacity:.85">' + esc(w.en) + '</span></span>' +
          '</span></button>';
      }).join('') + '</div>' : '') +
    (nextId ? '<div style="margin-top:24px"><button class="big" id="nx">' + t('next') + '</button></div>' : '') +
    thanksCard());
  document.getElementById('bk').onclick = function () { F.back('#/'); };
  var nx = document.getElementById('nx'); if (nx) nx.onclick = function () { location.hash = '#/ep/' + nextId; };
  Array.prototype.forEach.call(app.querySelectorAll('[data-w]'), function (b) {
    b.onclick = function () {
      var w = words[+b.getAttribute('data-w')];
      if (!b.classList.contains('flip')) FAM.speak(w.en, 0.8);
      b.classList.toggle('flip');
    };
  });
  wireThanks();
  /* звезда — за досмотренный мультик: 90 % или конец */
  var v = document.getElementById('v');
  function award() {
    if (F.mark('seen', id)) {
      toast(STAR + t('gotStar'));
      Array.prototype.forEach.call(app.querySelectorAll('.stars'), function (s) { s.innerHTML = STAR + t('stars')(S.seen.length, IDS.length); });
    }
  }
  v.addEventListener('ended', award);
  v.addEventListener('timeupdate', function () { if (v.duration && v.currentTime / v.duration > 0.9) award(); });
}

function route() {
  if (!S.lang) return scrLang();
  /* пришёл по чужой ссылке, а на телефоне вход с другим промокодом — новый вход */
  if (F.linkCode && S.code && F.linkCode !== S.code) F.logout();
  if (!F.signedIn()) return scrLogin();
  var p = (location.hash || '').replace(/^#\/?/, '').split('/');
  if (p[0] === 'ep' && p[1]) return scrEp(p[1]);
  scrHome();
}

if (F.DEMO) document.body.insertAdjacentHTML('afterbegin', '<div class="demo">Демо: любой промокод из 8 знаков, в базу ничего не уходит</div>');
window.onhashchange = route;
route();
})();
</script>
</body>
</html>
