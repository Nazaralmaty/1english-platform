<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F4F0">
<title>1English · дашборд</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="app/style.css">
<style>
  /* Дашборд — та же таблица Supabase, просто читаемая. Смотрят с ноутбука,
     поэтому колонка одна, но широкая; на телефоне таблица едет вбок внутри
     своей рамки, а страница стоит на месте.

     ВАЖНО про имена классов. Здесь живёт та же app/style.css, что и на
     экранах ученика, а в ней уже заняты .bar (полоска прогресса, 6px и
     overflow:hidden) и .panel (аккордеон урока, max-height:0). Раньше шапка
     дашборда и обе нижние секции попадали под эти правила и обрезались.
     Поэтому всё своё — с приставкой d-. */
  body{background:var(--bg)}
  .dash{max-width:1180px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 20px 72px}

  .d-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:24px}
  .d-head h1{font-size:26px;letter-spacing:-.03em}
  .d-tabs{display:flex;gap:4px;background:var(--card);border-radius:999px;padding:4px;
          box-shadow:var(--sh-1);flex:1;min-width:260px;max-width:460px}
  .d-tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 14px;
                 font:inherit;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;
                 white-space:nowrap;transition:background .15s var(--ease),color .15s var(--ease)}
  .d-tabs button.on{background:var(--navy);color:var(--on-navy)}
  /* листы графиков: по одному на учителя */
  .sheets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .sheets button{background:var(--card);border:0;border-radius:999px;padding:11px 18px;font:inherit;
                 font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;box-shadow:var(--sh-1)}
  .sheets button.on{background:var(--navy);color:var(--on-navy)}
  .sheets button span{font-weight:400;opacity:.7;font-size:12.5px;margin-left:6px}
  .d-sub{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .d-sub h2{font-size:20px;letter-spacing:-.02em}
  .d-sub span{font-size:13.5px;color:var(--muted)}
  .addtime{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap;
           font-size:13.5px;color:var(--muted)}
  .addtime input{background:var(--bg);border:0;border-radius:12px;padding:10px 12px;font:inherit;
                 font-size:14.5px;color:var(--ink)}
  .addtime button{background:var(--bg);border:0;border-radius:12px;padding:10px 16px;font:inherit;
                  font-size:14px;font-weight:700;color:var(--navy);cursor:pointer}
  .stu-line{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:14px;
            border-top:1px solid var(--line)}
  .stu-line span{background:var(--bg);border-radius:999px;padding:7px 13px;font-size:13px;
                 font-variant-numeric:tabular-nums}
  .stu-line span b{font-weight:700}
  .live{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);
        font-variant-numeric:tabular-nums}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;
          animation:pulse 2.4s var(--ease) infinite}
  .live.off i{background:var(--accent);animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:24px}
  .kpi{background:var(--card);border-radius:var(--r-card);box-shadow:var(--sh-1);padding:18px 20px;
       position:relative;overflow:hidden}
  .kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--track)}
  .kpi.hot::before{background:var(--accent)}
  .kpi b{display:block;font-size:32px;font-weight:800;letter-spacing:-.045em;line-height:1.05;
         font-variant-numeric:tabular-nums}
  .kpi span{display:block;font-size:13px;color:var(--muted);margin-top:4px}

  .wrap{background:var(--card);border-radius:var(--r-card);box-shadow:var(--sh-1);overflow:hidden}
  .scrollx{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:760px}
  th,td{text-align:left;padding:14px 18px;font-size:14.5px;white-space:nowrap;vertical-align:middle}
  th{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;
     border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:1}
  tr + tr td{border-top:1px solid var(--line)}
  tbody tr{transition:background .15s var(--ease)}
  tbody tr:hover{background:var(--bg)}
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}

  /* имя ученика: кружок с инициалом вместо пустого места слева */
  .who{display:flex;align-items:center;gap:11px}
  .ava{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
       background:var(--navy);color:var(--on-navy);font-weight:800;font-size:14px}
  .who b{font-weight:700;display:block}
  .who .ph{display:block;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

  .lvl{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--bg);
       font-size:12px;font-weight:700;color:var(--navy)}
  .lvl.none{color:var(--muted)}
  .mini{display:flex;align-items:center;gap:10px;min-width:170px}
  .mini .track{flex:1;height:6px;border-radius:999px;background:var(--track);overflow:hidden}
  .mini .track i{display:block;height:100%;border-radius:999px;background:var(--accent);
                 transition:width .4s var(--ease)}
  .mini span{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);width:38px;text-align:right}
  .ago{color:var(--muted);font-variant-numeric:tabular-nums}
  .ago.hot{color:var(--ok);font-weight:700}
  .d-empty{padding:44px 18px;text-align:center;color:var(--muted);line-height:1.5}

  /* нижние секции идут в две колонки на широком экране */
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;margin-top:16px;
         align-items:start}
  .d-panel{background:var(--card);border-radius:var(--r-card);box-shadow:var(--sh-1);padding:20px}
  .d-panel h2{font-size:18px;letter-spacing:-.02em;margin-bottom:4px}
  .d-hint{font-size:13.5px;color:var(--muted);margin-bottom:14px;line-height:1.5}
  .d-row{display:flex;gap:8px;flex-wrap:wrap}
  .d-row input,.d-row select{flex:1;min-width:140px;background:var(--bg);border:0;border-radius:12px;
              padding:12px 14px;font:inherit;font-size:15px;color:var(--ink);
              outline:2px solid transparent;transition:outline-color .15s var(--ease)}
  .d-row input:focus,.d-row select:focus{outline-color:var(--navy)}
  .d-row button{background:var(--navy);color:var(--on-navy);border-radius:12px;
               padding:12px 20px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;border:0}
  .d-row button:disabled{opacity:.5;cursor:default}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip2{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border-radius:999px;
         padding:8px 8px 8px 14px;font-size:14px;font-variant-numeric:tabular-nums}
  .chip2 b{font-weight:700}
  .chip2 span{color:var(--muted);font-size:13px}
  .chip2 button{width:24px;height:24px;border-radius:50%;border:0;cursor:pointer;
                background:var(--card);color:var(--accent);font:inherit;font-size:14px;line-height:1}
  /* Развёрнутая анкета: аккаунт и карточка ученика у учителя в одной форме */
  .d-sec{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;
         text-transform:uppercase;margin:20px 0 12px;padding-top:16px;border-top:1px solid var(--line)}
  .d-form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(152px,1fr))}
  .d-form .one{grid-column:1/-1}
  .d-form label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .d-form input,.d-form select,.d-form textarea{width:100%;background:var(--bg);border:0;border-radius:12px;
       padding:11px 13px;font:inherit;font-size:14.5px;color:var(--ink);
       outline:2px solid transparent;transition:outline-color .15s var(--ease)}
  .d-form textarea{min-height:76px;resize:vertical;line-height:1.5}
  .d-form input:focus,.d-form select:focus,.d-form textarea:focus{outline-color:var(--navy)}
  .days{display:flex;flex-wrap:wrap;gap:6px}
  .days label{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:999px;
              padding:9px 13px;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;margin:0}
  .days input{width:auto;accent-color:var(--navy)}
  .tlist{margin-top:12px;font-size:13.5px}
  .tlist div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;
             border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  .tlist div b{font-weight:700}
  .tlist div span{color:var(--muted)}
  .state{font-size:13.5px;margin-top:12px;min-height:20px;line-height:1.45}
  .state.ok{color:var(--ok)}
  .state.bad{color:var(--accent)}
  /* выданный код показываем крупно: его диктуют вслух */
  .issued{margin-top:14px;background:var(--bg);border-radius:14px;padding:14px 16px;line-height:1.5}
  .issued b{display:block;font-size:26px;font-weight:800;letter-spacing:.12em;
            font-variant-numeric:tabular-nums}
  .issued span{font-size:13px;color:var(--muted)}
  .errs{margin-top:10px;font-size:13.5px}
  .errs div{padding:9px 0;border-top:1px solid var(--line);color:var(--muted);line-height:1.45}
  .errs div b{color:var(--ink);font-weight:600;display:block}
  .mini2{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  td .reset{background:var(--bg);border:0;border-radius:999px;padding:7px 13px;font:inherit;
            font-size:12.5px;font-weight:700;color:var(--navy);cursor:pointer;
            transition:background .15s var(--ease)}
  td .reset:hover{background:var(--track)}
  .auth{max-width:380px;margin:8vh auto 0}
  .err{color:var(--accent);font-size:14px;min-height:20px;margin:10px 0}
</style>
</head>
<body>
<div class="dash" id="root"></div>

<script src="app/db.js"></script>
<script src="app/course.js"></script>
<script src="app/schedule.js"></script>
<script>
(function () {
  'use strict';

  var root = document.getElementById('root');
  var timer = null, lastData = null;

  var DAYS = SCHED.DAYS;

  /* Ставка одного урока в 1English. От неё считается вся зарплата: если в
     карточке ученика и у учителя пусто, берётся она. */
  var RATE = 1150;

  var view = 'students';   /* students | new | sched | all */
  var schedTeacher = null; /* чей лист графика открыт */
  var extraTimes = [];     /* часы, которые админ добавил в сетку руками */

  /* Кавычки экранируются наравне со скобками: почти всё, что здесь
     рисуется, ученик пишет сам (имя, номер), а часть значений уходит
     внутрь атрибутов — data-reset, data-del. Без кавычек номер вида
     77011111111" onmouseover="…  выламывается из атрибута и исполняется
     уже под админским токеном. */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* Сколько шагов у урока вообще есть: пустой урок в знаменатель не идёт,
     иначе прогресс всегда упирается в потолок из будущих уроков. */
  function stepsOf(lesson) {
    var n = 0;
    if ((window.VIDEOS || {})[lesson.id] || lesson.rule) n++;
    if (lesson.tasks.length) n++;
    if (lesson.words.length) n++;
    return n;
  }
  function levelCapacity(levelId) {
    var lv = COURSE.levels.filter(function (l) { return l.id === levelId; })[0];
    if (!lv) return 0;
    return lv.lessons.reduce(function (n, s) { return n + stepsOf(s); }, 0);
  }
  /* Какому уровню принадлежит урок. Ученик может пройти Beginner и уйти на
     Elementary — его старые строки остаются в базе. Если считать их в
     знаменателе нового уровня, выходит 263%: проверено на замере. */
  function levelOfLesson(lessonId) {
    var out = null;
    COURSE.levels.forEach(function (l) {
      l.lessons.forEach(function (s) { if (s.id === lessonId) out = l.id; });
    });
    return out;
  }
  function lessonById(lessonId) {
    var out = null;
    COURSE.levels.forEach(function (l) {
      l.lessons.forEach(function (s) { if (s.id === lessonId) out = s; });
    });
    return out;
  }
  function levelTitle(levelId) {
    var lv = COURSE.levels.filter(function (l) { return l.id === levelId; })[0];
    return lv ? lv.title : '—';
  }

  function ago(iso) {
    if (!iso) return '—';
    var m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 1) return 'сейчас';
    if (m < 60) return m + ' мин назад';
    var h = Math.floor(m / 60);
    if (h < 24) return h + ' ч назад';
    var d = Math.floor(h / 24);
    return d + ' дн назад';
  }
  /* Номер приходит из строки ученика, а её ученик правит сам. В разметку
     он попадает только цифрами: всё остальное отрезается здесь. */
  function digits(p) { return String(p == null ? '' : p).replace(/\D/g, '').slice(0, 11); }

  function phoneFmt(p) {
    var d = digits(p);
    return d.length === 11
      ? '+' + d[0] + ' (' + d.slice(1, 4) + ') ' + d.slice(4, 7) + ' ' + d.slice(7, 9) + ' ' + d.slice(9)
      : (p || '—');
  }

  /* «1 ученик», «2 ученика», «5 учеников»: число рядом с существительным
     встречается в дашборде часто, а «1 учеников» читается как поломка. */
  function plural(n, one, few, many) {
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return n + ' ' + many;
    if (b > 1 && b < 5) return n + ' ' + few;
    if (b === 1) return n + ' ' + one;
    return n + ' ' + many;
  }

  function initial(name) {
    var n = String(name || '').trim();
    return n ? n[0].toUpperCase() : '?';
  }

  /* ── вход ─────────────────────────────────────────────────────────── */
  function auth(message) {
    root.innerHTML =
      '<div class="auth">' +
        '<h1 style="margin-bottom:8px">Дашборд</h1>' +
        '<p class="sub" style="margin-bottom:22px">Вход тем же номером, что и в платформе. Список видит только аккаунт из таблицы en_admins.</p>' +
        '<input class="field" id="ph" type="tel" inputmode="numeric" value="+7">' +
        '<div class="gap-sm"></div>' +
        '<input class="field" id="cd" type="tel" inputmode="numeric" maxlength="6" placeholder="000000">' +
        '<p class="err" id="err">' + esc(message || '') + '</p>' +
        '<button class="btn" id="go">Войти</button>' +
      '</div>';

    root.querySelector('#go').onclick = function () {
      var btn = this, err = root.querySelector('#err');
      btn.disabled = true; btn.textContent = 'Секунду…'; err.textContent = '';
      DB.enter(root.querySelector('#ph').value, root.querySelector('#cd').value)
        .then(start)
        .catch(function (e) {
          btn.disabled = false; btn.textContent = 'Войти';
          err.textContent = e.message;
        });
    };
  }

  /* ── данные ───────────────────────────────────────────────────────── */
  function pull() {
    return DB.listAll().then(function (d) {
      if (!d.isAdmin) {
        stop();
        DB.signOut();
        return auth('Этот номер не админ. Дашборд открывает только таблица en_admins, en_allowed прав не даёт. Supabase → SQL Editor: select public.en_make_admin(\'ваш номер\');');
      }
      lastData = d;
      if (busy()) return;   /* не затирать наполовину заполненную форму */
      render(d);
    }).catch(function (e) {
      var live = root.querySelector('.live');
      if (live) { live.className = 'live off'; live.lastChild.textContent = ' ' + e.message; }
      else auth(e.message);
    });
  }

  /* Раз в десять секунд страница перерисовывается целиком. Пока админ
     печатает в любой форме — обновление пропускается, иначе введённое
     исчезает прямо из-под рук. */
  function busy() {
    var el = document.activeElement;
    if (el && root.contains(el) && /^(INPUT|SELECT)$/.test(el.tagName)) return true;
    /* «Печатает» — это значение, отличное от того, что нарисовано в
       разметке. Без сравнения с умолчанием анкета с готовыми «4 месяца,
       12 уроков, 18:00» считалась заполненной всегда, и страница
       переставала обновляться совсем. */
    var filled = false;
    Array.prototype.forEach.call(root.querySelectorAll('.d-panel input,.d-panel textarea'), function (i) {
      /* Сравниваем с умолчанием, а не с пустотой. Иначе анкета, где уже
         нарисованы «4 месяца», «12 уроков», 18:00 и отмеченные Пн–Пт у
         учителя, считалась заполненной всегда: страница переставала
         обновляться, и заведённый учитель не появлялся в списке — ровно
         тот случай, когда «нажал, и ничего не произошло». */
      if (i.type === 'checkbox') { if (i.checked !== i.defaultChecked) filled = true; return; }
      var def = (i.getAttribute('value') || '').trim();
      if (i.value.trim() && i.value.trim() !== def) filled = true;
    });
    return filled;
  }

  function render(d) {
    var byStudent = {};
    d.progress.forEach(function (r) {
      var s = byStudent[r.student_id] || (byStudent[r.student_id] = { steps: 0, lessons: {}, last: null });
      s.steps++;
      (s.lessons[r.lesson] = s.lessons[r.lesson] || []).push(r.step);
      if (!s.last || r.updated_at > s.last) s.last = r.updated_at;
    });

    var week = Date.now() - 7 * 864e5, today = new Date().toISOString().slice(0, 10);
    var active = 0, todaySteps = 0;
    d.progress.forEach(function (r) { if (String(r.updated_at).slice(0, 10) === today) todaySteps++; });

    /* Партии в играх. Таблицы en_games может ещё не быть — тогда здесь
       пусто, и колонка честно показывает ноль, а не прячется. */
    var gamesAll = d.games || [], gamesWeek = 0, gamesBy = {};
    gamesAll.forEach(function (r) {
      gamesBy[r.student_id] = (gamesBy[r.student_id] || 0) + 1;
      if (new Date(r.created_at).getTime() > week) gamesWeek++;
    });

    var rows = d.students.map(function (st) {
      var p = byStudent[st.id] || { steps: 0, lessons: {}, last: null };
      var cap = levelCapacity(st.level);
      var last = p.last && p.last > st.updated_at ? p.last : st.updated_at;
      if (new Date(last).getTime() > week) active++;

      /* Процент и «уроков закрыто» — по текущему уровню ученика: только он
         стоит в знаменателе. Колонка «шагов» остаётся общей: это всё, что
         человек сделал на платформе, включая прошлые уровни. */
      var mine = 0, done = 0;
      Object.keys(p.lessons).forEach(function (id) {
        if (levelOfLesson(id) !== st.level) return;
        var lesson = lessonById(id);
        if (!lesson) return;
        var uniq = {};
        p.lessons[id].forEach(function (step) { uniq[step] = true; });
        var n = Object.keys(uniq).length;
        mine += Math.min(n, stepsOf(lesson));
        if (n >= stepsOf(lesson)) done++;
      });
      var pct = cap ? Math.min(100, Math.round(mine / cap * 100)) : 0;

      return { st: st, pct: pct, steps: p.steps, done: done, last: last,
               games: gamesBy[st.id] || 0 };
    }).sort(function (a, b) { return (b.last || '').localeCompare(a.last || ''); });

    /* Один экран и четыре кнопки вместо четырёх ссылок: ученики, заведение,
       графики и сводная. Всё, что нужно админу, — здесь; отдельно живёт
       только кабинет учителя. */
    root.innerHTML =
      '<div class="d-head">' +
        '<h1>Дашборд</h1>' +

      '</div></div>' +

          '<div class="grid2">' +
        /* Список допущенных номеров. Пустой список пускает всех — так удобно
           на пробном этапе, поэтому состояние написано словами. */
        '<div class="d-panel">' +
          '<h2>Кто допущен</h2>' +
          '<div class="d-hint" id="allowHint">Загружаю…</div>' +
          '<div class="d-row">' +
            '<input id="apPhone" type="tel" placeholder="+7 701 123 45 67">' +

          '<h2>Падения у учеников</h2>' +

        )
      : view === 'new'
        ? (
      /* Заявка на ученика. Регистрация с улицы выключена, поэтому это

         возраст, город, цель, формат, график и сетка уроков. Учитель её не

      '<div class="d-panel" style="margin-top:16px">' +
        '<h2>Новый ученик</h2>' +
        '<div class="d-hint">Аккаунт заводится сразу: номер станет логином, шесть цифр — кодом. ' +
          'Номер сам попадёт в список допущенных. Уровень курса можно не ставить — ученик выберет при входе.</div>' +

        '<div class="d-sec" style="border:0;padding:0;margin-top:0">Аккаунт в платформе</div>' +
        '<div class="d-form">' +
          '<div><label>Телефон *</label><input id="nsPhone" type="tel" inputmode="numeric" placeholder="+7 701 123 45 67"></div>' +
          '<div><label>Имя *</label><input id="nsName" type="text" placeholder="Аяжан"></div>' +
          '<div><label>Код, 6 цифр *</label><input id="nsCode" type="tel" inputmode="numeric" maxlength="6" placeholder="481902"></div>' +
          '<div><label>Уровень курса</label><select id="nsLevel">' +
            '<option value="">потом выберет сам</option>' +
            COURSE.levels.map(function (l) {
              return '<option value="' + esc(l.id) + '">' + esc(l.title) + '</option>';
            }).join('') +
          '</select></div>' +
        '</div>' +

        '<div class="d-sec">Карточка у учителя</div>' +
        '<div class="d-hint">Выберите учителя — и ученик встанет к нему на доску вместе с сеткой уроков. ' +
          '«Без учителя» — заведём только аккаунт, карточку добавите позже.</div>' +
        '<div class="d-form">' +
          '<div><label>Учитель</label><select id="nsTeacher">' +
            '<option value="">Без учителя</option>' +
            (d.teachers || []).map(function (t) {
              return '<option value="' + esc(t.id) + '">' + esc(t.name || phoneFmt(t.phone)) + '</option>';
            }).join('') +
          '</select></div>' +
          '<div><label>Возраст</label><input id="nsAge" type="number" min="3" max="99" placeholder="14"></div>' +
          '<div><label>Город</label><input id="nsCity" type="text" placeholder="Алматы"></div>' +
          '<div><label>Нынешний уровень</label><input id="nsLvlText" type="text" placeholder="Beginner"></div>' +
          '<div><label>Формат</label><select id="nsFormat">' +
            '<option value="individual">Индивидуально</option>' +
            '<option value="group">Группа</option>' +
          '</select></div>' +
          '<div><label>Время</label><input id="nsTime" type="time" value="18:00"></div>' +
          '<div><label>Месяцев обучения</label><input id="nsMonths" type="number" min="1" max="36" value="4"></div>' +
          '<div><label>Уроков в месяце</label><input id="nsPer" type="number" min="1" max="31" value="12"></div>' +
          '<div><label>Ставка учителю, ₸ за урок</label><input id="nsRate" type="number" min="0" placeholder="как у учителя, ' + RATE + '"></div>' +
          '<div><label>Начало занятий</label><input id="nsStart" type="date" value="' +
            new Date().toISOString().slice(0, 10) + '"></div>' +
          '<div class="one"><label>Дни недели</label><div class="days">' +
            DAYS.map(function (x) {
              return '<label><input type="checkbox" data-day="' + x[0] + '">' + x[1] + '</label>';
            }).join('') + '</div></div>' +
          '<div class="one"><label>Цель обучения</label><input id="nsGoal" type="text" placeholder="Сдать IELTS на 6.5"></div>' +
          '<div class="one"><label>Описание ученика</label><textarea id="nsNote" placeholder="Что важно знать учителю: характер, чего боится, что уже пробовал"></textarea></div>' +
          '<div class="one"><label>Темы уроков, по одной в строке</label><textarea id="nsTopics" placeholder="Знакомство&#10;Глагол to be&#10;Present Simple"></textarea></div>' +
          '<div class="one"><label>Домашние задания, по одному в строке</label><textarea id="nsHw" placeholder="Слова 1–10&#10;Упражнение 3"></textarea></div>' +
        '</div>' +

        '<div class="d-row" style="margin-top:14px"><button id="nsAdd">Завести</button></div>' +
        '<div class="state" id="nsState"></div>' +
        '<div id="nsCard"></div>' +
      '</div>' +

          '<div class="grid2">' +
        /* Учитель — это обычный аккаунт платформы, помеченный в en_teachers.
           Сначала заводим его формой выше как ученика, потом помечаем здесь. */
        '<div class="d-panel">' +
          '<h2>Учителя</h2>' +
          '<div class="d-hint">Аккаунт учителя заводится формой «Новый ученик» — номер и код. ' +
            'Потом номер отмечается здесь: с этого момента по нему открывается <b>teacher.html</b>. ' +
            'Рабочие часы тут задаются грубо, по одной сетке на неделю; ' +
            'поштучно окна открываются и закрываются на вкладке «Графики».</div>' +
          '<div class="d-form">' +
            '<div><label>Телефон</label><input id="tcPhone" type="tel" placeholder="+7 701 123 45 67"></div>' +
            '<div><label>Имя</label><input id="tcName" type="text" placeholder="Айгерім"></div>' +
            '<div><label>Ставка, ₸ за урок</label><input id="tcRate" type="number" min="0" placeholder="' + RATE + '"></div>' +
            '<div class="one"><label>Резюме</label><textarea id="tcBio" placeholder="Опыт, методика, чем сильна"></textarea></div>' +
            '<div class="one"><label>Рабочие дни</label><div class="days">' +
              DAYS.map(function (x) {
                return '<label><input type="checkbox" data-tday="' + x[0] + '"' +
                       (x[0] !== 'sat' && x[0] !== 'sun' ? ' checked' : '') + '>' + x[1] + '</label>';
              }).join('') + '</div></div>' +
            '<div><label>Ведёт с</label><input id="tcFrom" type="time" step="3600" value="15:00"></div>' +
            '<div><label>По</label><input id="tcTo" type="time" step="3600" value="20:00"></div>' +
          '</div>' +
          '<div class="d-row" style="margin-top:12px"><button id="tcAdd">Сделать учителем</button></div>' +
          ((d.teachers || []).length
            ? '<div class="tlist">' + d.teachers.map(function (t) {
                var n = (d.cards || []).filter(function (c) { return c.teacher_id === t.id; }).length;
                var sl = SCHED.slots(t);
                return '<div><b>' + esc(t.name || 'Без имени') + '</b>' +
                       '<span>' + esc(phoneFmt(t.phone)) + ' · ' + (t.rate || RATE) + ' ₸ · ' +
                       plural(n, 'ученик', 'ученика', 'учеников') + ' · ' +
                       (sl.length ? plural(sl.length, 'окно', 'окна', 'окон') + ' в неделю'
                                  : 'график не задан') + '</span></div>';
              }).join('') + '</div>'
            : '<div class="mini2" style="margin-top:10px">Учителей пока нет.</div>') +
          '<div class="state" id="tcState"></div>' +
        '</div>' +
          '</div>'
        )
      : view === 'sched' ? viewSched(d)
      : viewAll(d));

    root.querySelector('#out').onclick = function () { stop(); DB.signOut(); auth(''); };

    Array.prototype.forEach.call(root.querySelectorAll('[data-view]'), function (b) {
      b.onclick = function () { view = b.getAttribute('data-view'); render(lastData); };
    });

    Array.prototype.forEach.call(root.querySelectorAll('[data-reset]'), function (b) {
      b.onclick = function () { resetCode(b.getAttribute('data-reset')); };
    });
    wireAllowed();
    wireNewStudent();
    wireTeachers();
    wireSched();

  /* ── графики ────────────────────────────────────────────────────────
     Лист на учителя: недельная сетка, где видно и его рабочее время, и кто
     в нём сидит. Свободная клетка зелёная — на неё и записывают ученика.
     Клик по пустой открывает окно, клик по зелёной закрывает: график
     учителя ведёт админ, сам учитель его только смотрит. */
  function viewSched(d) {
    var ts = d.teachers || [];
    if (!ts.length) {
      return '<div class="d-empty">Учителей пока нет. Заведите первого на вкладке «Завести».</div>';
    }
    if (!schedTeacher || !ts.filter(function (t) { return t.id === schedTeacher; })[0]) {
      schedTeacher = ts[0].id;
    }
    var t = ts.filter(function (x) { return x.id === schedTeacher; })[0];
    var mine = (d.cards || []).filter(function (c) {
      return c.teacher_id === t.id && !c.archived;
    });

    return '<div class="sheets">' +
        ts.map(function (x) {
          var n = (d.cards || []).filter(function (c) { return c.teacher_id === x.id && !c.archived; }).length;
          return '<button data-sheet="' + esc(x.id) + '"' + (x.id === t.id ? ' class="on"' : '') + '>' +
                 esc(x.name || phoneFmt(x.phone)) +
                 '<span>' + plural(n, 'ученик', 'ученика', 'учеников') + '</span></button>';
        }).join('') +
      '</div>' +

      '<div class="d-panel">' +
        '<div class="d-sub"><h2>' + esc(t.name || phoneFmt(t.phone)) + '</h2>' +
          '<span>' + esc(phoneFmt(t.phone)) + ' · ' + (t.rate || RATE) + ' ₸ за урок</span></div>' +
        SCHED.grid(t, mine, true, extraTimes) +
        '<div class="addtime">Нет нужного часа? ' +
          '<input id="scTime" type="time" step="900" value="19:00">' +
          '<button id="scAdd">Добавить строку</button>' +
        '</div>' +
        (mine.length
          ? '<div class="stu-line">' + mine.map(function (c) {
              return '<span><b>' + esc(c.name) + '</b> · ' +
                     esc(dayNames(c.days) || 'без дней') +
                     (c.time_at ? ', ' + esc(c.time_at) : '') + '</span>';
            }).join('') + '</div>'
          : '<div class="stu-line"><span>Учеников у этого учителя пока нет</span></div>') +
      '</div>';
  }

  function wireSched() {
    Array.prototype.forEach.call(root.querySelectorAll('[data-sheet]'), function (b) {
      b.onclick = function () { schedTeacher = b.getAttribute('data-sheet'); render(lastData); };
    });

    var add = root.querySelector('#scAdd');
    if (add) add.onclick = function () {
      var v = root.querySelector('#scTime').value;
      if (v && extraTimes.indexOf(v) < 0) extraTimes.push(v);
      render(lastData);
    };

    /* Клик по клетке. Рисуем сразу, не дожидаясь базы: админ проставляет
       график десятком кликов подряд, и ждать ответа на каждый — мучение.
       Не прошло — честно говорим и перечитываем с сервера. */
    Array.prototype.forEach.call(root.querySelectorAll('[data-slot]'), function (c) {
      if (c.className.indexOf('busy') >= 0) return;
      c.onclick = function () {
        var t = (lastData.teachers || []).filter(function (x) { return x.id === schedTeacher; })[0];
        if (!t) return;
        var parts = c.getAttribute('data-slot').split('@');
        t.slots = SCHED.toggle(t, parts[0], parts[1]);
        render(lastData);
        DB.rest('en_teachers?id=eq.' + encodeURIComponent(t.id), {
          method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: { slots: t.slots }
        }).catch(function (e) { alert('График не сохранён: ' + e.message); pull(); });
      };
    });
  }

  /* ── сводная ────────────────────────────────────────────────────────
     Все ученики всех учителей одной таблицей: кто кого ведёт, когда, на
     сколько уроков договорились и сколько из них закрыто. */
  function viewAll(d) {
    var cards = (d.cards || []).filter(function (c) { return !c.archived; });
    var byId = {};
    (d.teachers || []).forEach(function (t) { byId[t.id] = t; });
    var month = new Date().toISOString().slice(0, 7);

    var rows = cards.map(function (c) {
      var t = byId[c.teacher_id] || {};
      var all = c.lessons || [];
      var done = all.filter(function (l) { return l.done; }).length;
      var rate = c.rate == null ? (t.rate || RATE) : c.rate;
      var nowLessons = all.filter(function (l) {
        return l.done && String(l.done_at || '').slice(0, 7) === month;
      }).length;
      return { c: c, t: t, done: done, total: all.length, rate: rate,
               pct: all.length ? Math.round(done / all.length * 100) : 0,
               month: nowLessons, sum: nowLessons * rate, all: done * rate };
    }).sort(function (a, b) {
      return (a.t.name || '').localeCompare(b.t.name || '') || a.c.name.localeCompare(b.c.name);
    });

    var sumMonth = rows.reduce(function (a, r) { return a + r.sum; }, 0);
    var lesMonth = rows.reduce(function (a, r) { return a + r.month; }, 0);

    return '<div class="cards">' +
        '<div class="kpi"><b>' + rows.length + '</b><span>учеников у учителей</span></div>' +
        '<div class="kpi"><b>' + (d.teachers || []).length + '</b><span>учителей</span></div>' +
        '<div class="kpi' + (lesMonth ? ' hot' : '') + '"><b>' + lesMonth + '</b><span>уроков в этом месяце</span></div>' +
        '<div class="kpi"><b>' + money(sumMonth) + '</b><span>к выплате за месяц</span></div>' +
      '</div>' +

      '<div class="wrap"><div class="scrollx">' +
        (rows.length
          ? '<table><thead><tr>' +
              '<th>Ученик</th><th>Учитель</th><th>Формат</th><th>График</th>' +
              '<th class="num">Проведено</th><th class="num">План</th><th class="num">%</th>' +
              '<th class="num">Ставка</th><th class="num">За месяц</th>' +
            '</tr></thead><tbody>' +
            rows.map(function (r) {
              return '<tr>' +
                '<td><span class="who"><span class="ava">' + esc(initial(r.c.name)) + '</span>' +
                    '<span><b>' + esc(r.c.name) + '</b>' +
                    '<span class="ph">' + esc(phoneFmt(r.c.phone)) + '</span></span></span></td>' +
                '<td>' + esc(r.t.name || '—') + '</td>' +
                '<td><span class="lvl">' + (r.c.format === 'group' ? 'Группа' : 'Индивид') + '</span></td>' +
                '<td>' + esc(dayNames(r.c.days) || '—') +
                  (r.c.time_at ? ', ' + esc(r.c.time_at) : '') + '</td>' +
                '<td class="num">' + r.done + '</td>' +
                '<td class="num">' + r.total + '</td>' +
                '<td class="num">' + r.pct + '%</td>' +
                '<td class="num">' + r.rate + ' ₸</td>' +
                '<td class="num">' + money(r.sum) + '</td>' +
              '</tr>';
            }).join('') +
            '</tbody><tfoot><tr><td colspan="8">Всего к выплате за ' + esc(monthRu(month)) + '</td>' +
            '<td class="num">' + money(sumMonth) + '</td></tr></tfoot></table>'
          : '<div class="d-empty">Ни одной карточки у учителей. Заводите ученика на вкладке «Завести» ' +
            'и выбирайте учителя — он появится здесь.</div>') +
      '</div></div>';
  }

  function money(n) { return String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₸'; }
  function dayNames(csv) {
    var set = String(csv || '').split(',');
    return DAYS.filter(function (d) { return set.indexOf(d[0]) >= 0; })
               .map(function (d) { return d[1]; }).join(', ');
  }
  function monthRu(key) {
    if (!/^\d{4}-\d{2}$/.test(key)) return key;
    var names = ['январь','февраль','март','апрель','май','июнь','июль',
                 'август','сентябрь','октябрь','ноябрь','декабрь'];
    return names[Number(key.slice(5, 7)) - 1] + ' ' + key.slice(0, 4);
  }

  /* ── новый ученик ───────────────────────────────────────────────────
     Одна кнопка делает две вещи: аккаунт в платформе (номер + код) и
     карточку у учителя (анкета + сетка уроков). Вторая — только если
     учитель выбран: бывают ученики без учителя, и наоборот.

     Порядок важен. Сначала аккаунт: если номер занят, функция в базе
     скажет об этом словами, и карточка не заведётся впустую. */
  function wireNewStudent() {
    var btn = root.querySelector('#nsAdd');
    if (!btn) return;
    var state = root.querySelector('#nsState'), card = root.querySelector('#nsCard');
    var cd = root.querySelector('#nsCode');

    cd.oninput = function () { cd.value = cd.value.replace(/\D/g, ''); };
    function v(id) { var el = root.querySelector('#' + id); return el ? el.value.trim() : ''; }

    btn.onclick = function () {
      var phone = v('nsPhone'), code = v('nsCode'), name = v('nsName');
      if (String(phone).replace(/\D/g, '').length < 10) {
        state.className = 'state bad'; state.textContent = 'Проверьте номер'; return;
      }
      if (!/^[0-9]{6}$/.test(code)) {
        state.className = 'state bad'; state.textContent = 'Код — ровно шесть цифр'; return;
      }
      if (!name) {
        state.className = 'state bad'; state.textContent = 'Имя обязательно: по нему ученика ищут все экраны'; return;
      }

      btn.disabled = true; state.className = 'state'; state.textContent = 'Завожу…';
      DB.addStudent(phone, code, name, v('nsLevel')).then(function (answer) {
        /* функция в базе отвечает словами: и про успех, и про «уже заведён» */
        var okay = /^Готово/.test(answer);
        state.className = 'state ' + (okay ? 'ok' : 'bad');
        state.textContent = answer;
        if (!okay) return null;

        card.innerHTML = '<div class="issued"><b>' + esc(code) + '</b>' +
          '<span>Код для ' + esc(phoneFmt(phone)) + ' · ' + esc(name) +
          '. Продиктуйте его ученику: восстановить будет нечем, только сбросить.</span></div>';
        return addCard(v, name, phone).then(function (added) {
          if (added) state.textContent = answer + ' Карточка у учителя заведена.';
          clearForm();
        });
      }).catch(function (e) {
        state.className = 'state bad'; state.textContent = e.message;
      }).then(function () { btn.disabled = false; pull(); });
    };

    function clearForm() {
      ['nsPhone','nsName','nsCode','nsAge','nsCity','nsLvlText','nsGoal','nsNote','nsRate',
       'nsTopics','nsHw'].forEach(function (id) {
        var el = root.querySelector('#' + id); if (el) el.value = '';
      });
      Array.prototype.forEach.call(root.querySelectorAll('[data-day]'), function (i) { i.checked = false; });
    }
  }

  /* Карточка ученика у учителя и сразу вся сетка уроков: месяцев ×
     уроков в месяце. Сетка заводится целиком, а не по мере проведения, —
     учитель должен видеть план, а не пустое место. */
  function addCard(v, name, phone) {
    var teacher = v('nsTeacher');
    if (!teacher) return Promise.resolve(false);

    var days = [];
    Array.prototype.forEach.call(root.querySelectorAll('[data-day]'), function (i) {
      if (i.checked) days.push(i.getAttribute('data-day'));
    });
    var months = Math.min(36, Math.max(1, Number(v('nsMonths')) || 1));
    var per    = Math.min(31, Math.max(1, Number(v('nsPer')) || 1));

    return DB.rest('en_teacher_students', {
      method: 'POST', headers: { Prefer: 'return=representation' },
      body: {
        teacher_id: teacher, name: name, phone: digits(phone),
        age: Number(v('nsAge')) || null, city: v('nsCity') || null,
        level: v('nsLvlText') || null, format: v('nsFormat') || 'individual',
        days: days.join(','), time_at: v('nsTime') || null,
        goal: v('nsGoal') || null, note: v('nsNote') || null,
        rate: v('nsRate') === '' ? null : Number(v('nsRate')),
        months: months, per_month: per, started_on: v('nsStart') || null
      }
    }).then(function (rows) {
      var topics = v('nsTopics').split('\n'), hw = v('nsHw').split('\n');
      var plan = [], k = 0;
      for (var m = 1; m <= months; m++)
        for (var i = 1; i <= per; i++, k++)
          plan.push({ card_id: rows[0].id, month: m, idx: i,
                      topic: (topics[k] || '').trim() || null,
                      homework: (hw[k] || '').trim() || null });
      return DB.rest('en_teacher_lessons', {
        method: 'POST', headers: { Prefer: 'return=minimal' }, body: plan
      });
    }).then(function () { return true; });
  }

  /* ── учителя ──────────────────────────────────────────────────────── */
  function wireTeachers() {
    var btn = root.querySelector('#tcAdd');
    if (!btn) return;
    var state = root.querySelector('#tcState');
    function v(id) { var el = root.querySelector('#' + id); return el ? el.value.trim() : ''; }

    btn.onclick = function () {
      if (String(v('tcPhone')).replace(/\D/g, '').length < 10) {
        state.className = 'state bad'; state.textContent = 'Проверьте номер'; return;
      }
      /* Из «ведёт с 15:00 по 20:00» делаем часовые окна на каждый
         отмеченный день: пять дней по пять часов — это 25 слотов, и все
         они сразу видны на вкладке «Графики». */
      var days = [];
      Array.prototype.forEach.call(root.querySelectorAll('[data-tday]'), function (i) {
        if (i.checked) days.push(i.getAttribute('data-tday'));
      });
      var from = Number(String(v('tcFrom')).slice(0, 2));
      var to   = Number(String(v('tcTo')).slice(0, 2));
      var slots = [];
      if (days.length && to > from) {
        days.forEach(function (dd) {
          for (var h = from; h < to; h++) slots.push(dd + '@' + (h < 10 ? '0' + h : h) + ':00');
        });
      }

      btn.disabled = true; state.className = 'state'; state.textContent = 'Отмечаю…';
      DB.rpc('en_make_teacher', {
        p_phone: v('tcPhone'), p_name: v('tcName'),
        p_bio: v('tcBio'), p_rate: Number(v('tcRate')) || RATE,
        p_slots: slots.join(',')
      }).then(function (answer) {
        var okay = /^Готово/.test(answer);
        state.className = 'state ' + (okay ? 'ok' : 'bad');
        state.textContent = answer;
        if (okay) {
          ['tcPhone','tcName','tcBio','tcRate'].forEach(function (id) {
            var el = root.querySelector('#' + id); if (el) el.value = '';
          });
          pull();
        }
      }).catch(function (e) {
        state.className = 'state bad'; state.textContent = e.message;
      }).then(function () { btn.disabled = false; });
    };
  }

  /* ── список допущенных ────────────────────────────────────────────── */
  function wireAllowed() {
    var hint = root.querySelector('#allowHint');
    var list = root.querySelector('#apList');
    var state = root.querySelector('#apState');
    if (!hint) return;

    function say(text, bad) { state.className = 'state ' + (bad ? 'bad' : 'ok'); state.textContent = text; }

    function draw() {
      DB.allowed.list().then(function (rows) {
        hint.textContent = rows.length
          ? 'В списке ' + rows.length + '. Остальные номера зарегистрируются, но их прогресс в базу не ляжет.'
          : 'Список пуст — заходят все. Как только добавите первый номер, остальных перестанет пускать, поэтому начните со своего.';
        list.innerHTML = rows.map(function (r) {
          return '<span class="chip2"><b>' + esc(phoneFmt(r.phone)) + '</b>' +
                 (r.note ? '<span>' + esc(r.note) + '</span>' : '') +
                 '<button data-del="' + esc(digits(r.phone)) + '" title="Убрать">✕</button></span>';
        }).join('');
        Array.prototype.forEach.call(list.querySelectorAll('[data-del]'), function (b) {
          b.onclick = function () {
            DB.allowed.remove(b.getAttribute('data-del'))
              .then(function () { say('Убрали'); draw(); })
              .catch(function (e) { say(e.message, true); });
          };
        });
      }).catch(function (e) { hint.textContent = e.message; });
    }

    root.querySelector('#apAdd').onclick = function () {
      var ph = root.querySelector('#apPhone'), nt = root.querySelector('#apNote');
      DB.allowed.add(ph.value, nt.value.trim()).then(function () {
        ph.value = ''; nt.value = ''; say('Добавили'); draw();
      }).catch(function (e) { say(e.message, true); });
    };

    draw();
  }

  /* ── сброс кода ───────────────────────────────────────────────────── */
  function resetCode(phone) {
    var code = prompt('Новый код из шести цифр для ' + phoneFmt(phone) + ':', '');
    if (!code) return;
    DB.resetCode(phone, code.trim()).then(function (answer) {
      alert(answer);
      pull();
    }).catch(function (e) { alert(e.message); });
  }

  /* Обновление раз в 10 секунд вместо подписки на изменения: для десятков
     учеников разницы не видно, а websocket и переподключения не нужны.
     Вкладка в фоне не опрашивает — это лишние запросы в бесплатный тариф. */
  function start() {
    pull();
    stop();
    timer = setInterval(function () { if (!document.hidden) pull(); }, 10000);
  }
  function stop() { if (timer) clearInterval(timer); timer = null; }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && timer) pull(); });

  /* ── тестовый режим ───────────────────────────────────────────────
     dashboard.html?demo=1 — весь дашборд на выдуманных данных: ни базы,
     ни входа. Нужен, чтобы посмотреть и покликать, пока патч схемы не
     применён. Правки живут в памяти вкладки и пропадают с обновлением:
     ни одна строка никуда не уходит. Кабинет учителя устроен так же —
     teacher.html?demo=1. */
  function demo() {
    function les(done, tag) {
      var out = [];
      for (var i = 0; i < 12; i++)
        out.push({ id: tag + i, done: i < done,
                   done_at: i < done ? new Date(Date.now() - i * 864e5).toISOString() : null });
      return out;
    }
    var now = new Date().toISOString();
    var data = {
      isAdmin: true,
      students: [
        { id: 'a', phone: '77011234567', name: 'Аяжан',  level: 'beginner',   updated_at: now },
        { id: 'b', phone: '77029876543', name: 'Ернар',  level: 'elementary', updated_at: '2026-09-14T10:00:00Z' },
        { id: 'v', phone: '77014445566', name: 'Данияр', level: 'beginner',   updated_at: '2026-09-11T10:00:00Z' }
      ],
      progress: [
        { student_id: 'a', lesson: 'b1', step: 'read',  updated_at: now },
        { student_id: 'a', lesson: 'b1', step: 'task',  right_count: 5, total_count: 6, updated_at: now },
        { student_id: 'a', lesson: 'b1', step: 'words', updated_at: now },
        { student_id: 'a', lesson: 'b2', step: 'read',  updated_at: now },
        { student_id: 'b', lesson: 'e13', step: 'read', updated_at: '2026-09-14T10:00:00Z' }
      ],
      games: [{ student_id: 'a', game: 'flappy_english', created_at: now }],
      errors: [],
      teachers: [
        { id: 't1', name: 'Айгерім Нұрлан', phone: '77015550000', rate: 1150,
          bio: 'Десять лет в школе, пять — онлайн.',
          slots: 'mon@16:00,mon@17:00,mon@18:00,mon@19:00,tue@16:00,tue@17:00,tue@18:00,tue@19:00,' +
                 'wed@16:00,wed@17:00,wed@18:00,wed@19:00,thu@16:00,thu@17:00,thu@18:00,thu@19:00,' +
                 'fri@16:00,fri@17:00,fri@18:00,fri@19:00' },
        { id: 't2', name: 'Мадина Қайрат', phone: '77017778899', rate: 1150,
          bio: 'Ведёт разговорные группы по выходным.',
          slots: 'sat@11:00,sat@12:00,sun@11:00,sun@12:00' }
      ],
      cards: [
        { id: 'c1', teacher_id: 't1', name: 'Аяжан', phone: '77011234567', age: 14, city: 'Алматы',
          format: 'individual', days: 'mon,wed,fri', time_at: '18:00', archived: false,
          rate: null, months: 1, per_month: 12, lessons: les(9, 'a') },
        { id: 'c2', teacher_id: 't1', name: 'Ернар', phone: '77029876543', age: 11, city: 'Астана',
          format: 'group', days: 'tue,thu', time_at: '17:00', archived: false,
          rate: null, months: 1, per_month: 12, lessons: les(5, 'b') },
        { id: 'c3', teacher_id: 't1', name: 'Данияр', phone: '77014445566', age: 16, city: 'Шымкент',
          format: 'individual', days: 'thu', time_at: '20:00', archived: false,
          rate: 2000, months: 1, per_month: 12, lessons: les(3, 'c') },
        { id: 'c4', teacher_id: 't2', name: 'Әсем', phone: '77013332211', age: 12, city: 'Алматы',
          format: 'group', days: 'sat', time_at: '11:00', archived: false,
          rate: null, months: 1, per_month: 12, lessons: les(7, 'd') }
      ]
    };

    DB.init = function () { return true; };
    DB.userId = 'admin';
    DB.signOut = function () { location.search = ''; };
    DB.listAll = function () { return Promise.resolve(data); };
    DB.allowed = {
      list: function () { return Promise.resolve([]); },
      add:  function () { return Promise.resolve(); },
      remove: function () { return Promise.resolve(); }
    };
    DB.rest = function () { return Promise.resolve([{ id: 'new' }]); };
    DB.rpc  = function () { return Promise.resolve('Готово'); };
    DB.addStudent = function () { return Promise.resolve('Готово: тестовый режим, в базу ничего не ушло'); };
    DB.resetCode  = function () { return Promise.resolve('Готово: тестовый режим'); };
    start();
  }

  if (/demo=/.test(typeof location === 'undefined' ? '' : location.search)) demo();
  else if (DB.init()) start();
  else auth('');
})();
</script>
