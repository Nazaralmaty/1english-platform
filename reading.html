<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F4F0">
<meta name="robots" content="noindex">
<title>1English · чтение (тест)</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="app/style.css">
<style>
  /* ТЕСТОВАЯ СТРАНИЦА. Чтение с флип-картами: текст урока, в котором слова
     этого урока кликабельны. Нажал — карта со словом, нажал на карту —
     она переворачивается и показывает перевод и пример. Слова и переводы
     берутся из того же словаря урока (window.CONTENT), что и шаг «Словарь»,
     поэтому ничего не дублируется. Из приложения сюда ссылки нет; если
     формат приживётся, текст станет четвёртым шагом урока. */
  body{background:var(--bg)}
  .rd{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 60px}
  .rd-test{background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:10px 14px;
           font-size:13px;line-height:1.45;margin-bottom:18px}
  .rd-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .rd-top h1{font-size:24px;letter-spacing:-.03em}
  .lang{display:flex;background:var(--card);border-radius:999px;padding:3px;box-shadow:var(--sh-1)}
  .lang button{border:0;background:transparent;border-radius:999px;padding:7px 13px;font:inherit;
               font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
  .lang button.on{background:var(--navy);color:var(--on-navy)}
  .les{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px;
       scrollbar-width:none}
  .les::-webkit-scrollbar{display:none}
  .les button{flex:none;border:0;background:var(--card);border-radius:999px;padding:9px 14px;font:inherit;
              font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;box-shadow:var(--sh-1)}
  .les button.on{background:var(--navy);color:var(--on-navy)}
  .sheet{background:var(--card);border-radius:var(--r-card);box-shadow:var(--sh-1);padding:22px 20px;margin-top:6px}
  .sheet h2{font-size:20px;letter-spacing:-.02em;margin-bottom:4px}
  .sheet .topic{font-size:13.5px;color:var(--muted);margin-bottom:16px}
  .text{font-size:19px;line-height:1.75;color:var(--ink)}
  .text p + p{margin-top:12px}
  /* Слово урока: подчёркнуто пунктиром, открытое — залито мягким навы. */
  .w{border:0;background:none;padding:0 1px;margin:0;font:inherit;color:var(--navy);font-weight:700;
     cursor:pointer;border-bottom:2px dotted var(--navy);border-radius:3px;line-height:inherit}
  .w.seen{background:rgba(10,49,97,.08);border-bottom-style:solid}
  .count{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:13.5px;color:var(--muted)}
  .count .track{flex:1;height:6px;border-radius:999px;background:var(--track);overflow:hidden}
  .count .track i{display:block;height:100%;background:var(--accent);border-radius:999px;
                  transform-origin:left;transition:transform .3s var(--ease)}

  /* Карта всплывает снизу, как в шаге «Словарь». */
  .veil{position:fixed;inset:0;background:rgba(10,27,46,.45);display:none;align-items:flex-end;justify-content:center;
        padding:16px 16px calc(16px + env(safe-area-inset-bottom));z-index:10}
  .veil.open{display:flex}
  .flip{width:100%;max-width:420px;height:280px;perspective:1200px;cursor:pointer;
        animation:up .28s var(--ease)}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .flip-in{position:relative;width:100%;height:100%;transition:transform .5s var(--ease);transform-style:preserve-3d}
  .flip.back .flip-in{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
        background:var(--card);border-radius:26px;box-shadow:var(--sh-2);padding:28px 24px;
        display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
  .face.b{transform:rotateY(180deg)}
  .face .en{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
  .face .form{font-size:14px;color:var(--muted)}
  .face .tr{font-size:24px;font-weight:700;color:var(--navy)}
  .face .ex{font-size:15px;color:var(--muted);line-height:1.45}
  .face .hint{font-size:13px;color:var(--muted)}
  .face .say{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:0;
             background:var(--bg);font-size:18px;cursor:pointer}
  @media (prefers-reduced-motion:reduce){.flip,.flip-in{animation:none;transition:none}}
</style>
</head>
<body>
<div class="rd" id="root"></div>
<div class="veil" id="veil"><div class="flip" id="flip"><div class="flip-in" id="flipIn"></div></div></div>

<script src="app/course.js"></script>
<script>
(function () {
  'use strict';

  /* Тексты уроков Beginner. [слово] — слово урока; [форма|слово], когда
     в тексте другая форма (apples → apple). Ключ после черты — ровно
     поле en из словаря урока; не нашлось — проверка внизу скажет. */
  var TEXTS = {
    b1: 'It is Sunday morning. Mom puts [bread] and [fruit] on the table. I take a [spoon] and eat my yogurt.\n' +
        'After breakfast we go to the park by [train]. In the park there is a big [tree] with pink [flowers]. ' +
        'The sky is [blue]. I sit under the tree and read my [book].',
    b2: 'Look at the market table. What do you [see]? I [see] [ten] [apples|apple]. ' +
        '[One] apple is [green], and nine apples are [red].\n' +
        'Next to them there is a [yellow] banana. My bag is [blue]. I buy [one] kilo of apples and go home.',
    b3: 'There are [many] things in our kitchen. There are four [chairs|chair] and a table. ' +
        'On the table there are two [books|book] and three [apples|apple].\n' +
        'We have some [bread], but not [much]. There is [water] in the bottle. ' +
        'My brother puts too [much] [sugar] in his tea!',
    b4: 'Today is my birthday. We are in a small café. I want [soup] and a [salad]. My sister wants a [sandwich].\n' +
        'Dad drinks [coffee] and Mom drinks [tea]. I drink [water]. ' +
        'Then the waiter brings a big [cake] and [ice cream]. What a great day!',
    b5: 'I live in a big [city]. There are many [cars|car] and [buses|bus] on the streets. ' +
        'Every morning I go to school by [bus]. I sit by the [window] and look outside.\n' +
        'My two [friends|friend] sit next to me. One [child] reads a [book], another eats an [apple]. ' +
        'Our [city] has many [children|child] and many schools.',
    b6: 'We are going on a picnic. Do we have [any] bread? Yes, we have [some]. ' +
        'Do we have [much] [water]? No, only [a little]. Let\'s buy [some] water.\n' +
        'We have [a few] apples, but not [many]. How [much] [money] do we have? Only [a little], but it is enough.',
    b7: 'This is my family. [I] am Aruzhan. My [father] is a doctor. [He] works in a hospital. ' +
        'My [mother] is a teacher. [She] teaches English.\n' +
        'We have a cat. [It] is white and very lazy. My grandparents live in a village. ' +
        '[They] have a big garden. On Sundays [we] visit them.',
    b8: 'Tomorrow is Asel\'s birthday. I call my brother. "Can you help [me]?" I ask. ' +
        '"Of course, I can help [you]," he says.\n' +
        'We buy a book for [her]. Dad wants to [give] her flowers. Our uncle is late, so we wait for [him]. ' +
        'Our cousins come too, and we invite [them] to dinner. ' +
        'Asel opens the box and says: "Thank you! I love [it]!" Then she hugs [us].',
    b9: 'I want a new phone. The black phone is [bigger] [than] the white one. ' +
        'The white phone is [lighter] and [cheaper].\n' +
        'The black phone is [more expensive], but its camera is [better]. ' +
        'The shop near my house is [closer] [than] the mall, and the line in the mall is [longer]. ' +
        'So I buy the white phone in the small shop.',
    b10: 'Let me tell you about my class. Daniyar is the [tallest] boy. Aigerim is the [kindest] girl: she always helps.\n' +
         'Timur is very [talkative]. He talks all day! He is also the [funniest]. ' +
         'Our school café has the [cheapest] lunch in town, and the soup is [delicious]. ' +
         'The [most comfortable|comfortable] chair is in the library. It is the [best] place to read.',
    b11: 'Welcome to my house! It is small but [comfortable]. This is the [living room]. ' +
         'We have a big grey [sofa] here. Next to it is the [kitchen], where my mom cooks.\n' +
         'My [bedroom] is upstairs. The [bathroom] is next to my bedroom. ' +
         'Behind the house there is a little [garden]. It is very [quiet] there in the evening.',
    b12: 'Every summer my family goes on [holiday]. [Where] do we go? To the mountains near Almaty. ' +
         '[When] do we go? In July. [Who] goes with us? My cousins.\n' +
         '[Why] the mountains? Because the [weather] is cool there. [What] do we do? We walk and swim in the lake. ' +
         '[How long] do we stay? Ten days.',
    b13: 'I have a big family. My [grandparents] live in Shymkent. My [uncle] Serik is my father\'s brother, ' +
         'and my [aunt] Gulnar is my mother\'s sister. Their son Arman is my [cousin]. He is also my [best friend].\n' +
         'At school my [classmate] Dana sits next to me. In football, Timur is my [team-mate]. ' +
         'I also have an [online friend] from Turkey. We play games together.',
    b14: 'Today Aliya is [absent]. She is sick. Her mom goes to the shop. [How much] [milk] does she need? One litre. ' +
         '[How many] [apples|apple] does she need? Five. She also buys [water] and a little [sugar].\n' +
         'In the evening Aliya asks her friend: "[How much] [homework] do we have?" "Not much," says her friend.'
  };

  var root = document.getElementById('root');
  var veil = document.getElementById('veil'), flip = document.getElementById('flip'),
      flipIn = document.getElementById('flipIn');

  var lang = 'kk', cur = 'b1', seen = {};
  try { lang = localStorage.getItem('1eng.reading.lang') || 'kk'; } catch (e) {}
  var m = /[?&]l=(b\d{1,2})/.exec(location.search);
  if (m && TEXTS[m[1]]) cur = m[1];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function lesson(id) { return (window.CONTENT || {})[id]; }
  function word(id, key) {
    var l = lesson(id);
    return l ? l.words.filter(function (w) { return w.en === key; })[0] : null;
  }
  function trn(w) { return (lang === 'kk' && w.kk) ? w.kk : (w.ru || w.kk || ''); }
  function speak(text) {
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 0.9;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* Текст → разметка. Обычный текст экранируется, слово урока становится
     кнопкой: на телефоне по кнопке попадают пальцем, и её видит скринридер. */
  function markup(id) {
    return TEXTS[id].split('\n').map(function (para) {
      var out = '', last = 0, re = /\[([^\]|]+)(?:\|([^\]]+))?\]/g, mm;
      while ((mm = re.exec(para))) {
        out += esc(para.slice(last, mm.index));
        var shown = mm[1], key = mm[2] || mm[1];
        var w = word(id, key) || word(id, key.toLowerCase());
        out += w
          ? '<button class="w' + (seen[id + ':' + w.en] ? ' seen' : '') + '" data-w="' + esc(w.en) +
            '" data-form="' + esc(shown) + '">' + esc(shown) + '</button>'
          : esc(shown);
        last = re.lastIndex;
      }
      return '<p>' + out + esc(para.slice(last)) + '</p>';
    }).join('');
  }

  function render() {
    var l = lesson(cur);
    var all = l ? l.words.length : 0;
    var open = l ? l.words.filter(function (w) { return seen[cur + ':' + w.en]; }).length : 0;
    root.innerHTML =
      '<div class="rd-test">Тестовая страница. Ученики её не видят, из приложения сюда ссылки нет.</div>' +
      '<div class="rd-top"><h1>Чтение</h1>' +
        '<div class="lang">' +
          '<button data-lang="kk"' + (lang === 'kk' ? ' class="on"' : '') + '>ҚАЗ</button>' +
          '<button data-lang="ru"' + (lang === 'ru' ? ' class="on"' : '') + '>РУС</button>' +
        '</div></div>' +
      '<div class="les">' + Object.keys(TEXTS).map(function (id) {
        return '<button data-les="' + id + '"' + (id === cur ? ' class="on"' : '') + '>Урок ' + id.slice(1) + '</button>';
      }).join('') + '</div>' +
      '<div class="sheet">' +
        '<h2>Урок ' + cur.slice(1) + '</h2>' +
        '<div class="topic">' + esc(l ? l.title : '') + ' · ' +
          (lang === 'kk' ? 'белгіленген сөзді бас' : 'нажми на выделенное слово') + '</div>' +
        '<div class="text">' + markup(cur) + '</div>' +
        '<div class="count"><span class="track"><i style="transform:scaleX(' + (all ? open / all : 0) + ')"></i></span>' +
          '<span>' + open + ' / ' + all + (lang === 'kk' ? ' сөз' : ' слов') + '</span></div>' +
      '</div>';

    Array.prototype.forEach.call(root.querySelectorAll('[data-les]'), function (b) {
      b.onclick = function () {
        cur = b.getAttribute('data-les');
        try { history.replaceState(null, '', '?l=' + cur); } catch (e) {}
        render(); window.scrollTo(0, 0);
      };
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-lang]'), function (b) {
      b.onclick = function () {
        lang = b.getAttribute('data-lang');
        try { localStorage.setItem('1eng.reading.lang', lang); } catch (e) {}
        render();
      };
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-w]'), function (b) {
      b.onclick = function () { card(b.getAttribute('data-w'), b.getAttribute('data-form')); };
    });
    var on = root.querySelector('.les .on');
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'center' });
  }

  /* Карта: лицо — слово и форма из текста, оборот — перевод и пример. */
  function card(key, form) {
    var w = word(cur, key);
    if (!w) return;
    var other = form && form.toLowerCase() !== w.en.toLowerCase();
    flipIn.innerHTML =
      '<div class="face a"><button class="say" data-say="1" aria-label="Слушать">🔊</button>' +
        '<div class="en">' + esc(w.en) + '</div>' +
        (other ? '<div class="form">в тексте: ' + esc(form) + '</div>' : '') +
        '<div class="hint">' + (lang === 'kk' ? 'аудару үшін бас' : 'нажми, чтобы перевернуть') + '</div></div>' +
      '<div class="face b"><button class="say" data-say="1" aria-label="Слушать">🔊</button>' +
        '<div class="tr">' + esc(trn(w)) + '</div>' +
        '<div class="en" style="font-size:22px">' + esc(w.en) + '</div>' +
        (w.ex ? '<div class="ex">' + esc(w.ex) + '</div>' : '') + '</div>';
    flip.className = 'flip';
    veil.className = 'veil open';
    speak(w.en);

    flip.onclick = function (e) {
      if (e.target.getAttribute('data-say')) { e.stopPropagation(); speak(flip.className.indexOf('back') >= 0 && w.ex ? w.ex : w.en); return; }
      e.stopPropagation();
      if (flip.className.indexOf('back') < 0) {
        flip.className = 'flip back';
        if (!seen[cur + ':' + w.en]) { seen[cur + ':' + w.en] = true; render(); }
      } else close();
    };
  }
  function close() { veil.className = 'veil'; }
  veil.onclick = close;
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

  render();
})();
</script>
</body>
</html>
